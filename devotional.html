/* Unconventional Wisdom — shared styles
   Palette: chocolate brown #6B4026 (--brand), warm white #FFFDF9, soft black #171513, caramel #A8734B (--gold) for highlights. Change it once here and the whole app follows. */

:root {
  --brand: #6B4026;
  --on-brand: #FFFDF9;
  --gold: #A8734B;
  --gold-deep: #8C5C38;
  --gold-soft: #F3E9DF;
  --bg: #6B4026;
  --surface: #FFFDF9;
  --surface-2: #F3ECE3;
  --ink: #FFFDF9;
  --muted: #D8CEC4;
  --line: rgba(255, 253, 249, .25);
  --on-gold: #171513;
  --btn-bg: #1C1714;
  --btn-fg: #FFFDF9;
  --good: #3F6B2B;
  --good-bg: #E3EFD6;
  --warn: #9A4A12;
  --shadow: 0 1px 2px rgba(23, 21, 19, .12), 0 8px 24px -12px rgba(23, 21, 19, .35);

  --font-head: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-ui: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;

  --r-sm: 10px;
  --r-md: 18px;
  --r-lg: 28px;
  --wrap: 1120px;
  --read: 41rem;
  --tabbar-h: 64px;
}

html[data-theme="dark"] {
  --bg: #171513;
  --surface: #1F1B18;
  --surface-2: #2A2420;
  --ink: #F3EDE5;
  --muted: #BDB2A7;
  --line: #3B322C;
  --brand: #6B4026;
  --on-brand: #F3EDE5;
  --gold: #A8734B;
  --gold-deep: #C28A5E;
  --gold-soft: #2E231B;
  --on-gold: #171513;
  --btn-bg: #F3EDE5;
  --btn-fg: #171513;
  --good: #A7D58A;
  --good-bg: #2A3A20;
  --warn: #F0B27A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -14px rgba(0, 0, 0, .6);
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
body {
  margin: 0;
  font-family: var(--font-ui);
  font-size: 1rem;
  line-height: 1.55;
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding-bottom: var(--tabbar-h);
}
main { flex: 1; }
img, svg { max-width: 100%; display: block; }
a { color: inherit; text-underline-offset: 3px; }
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-head); line-height: 1.15; margin: 0 0 .5em; letter-spacing: -.01em; }
h1 { font-size: clamp(1.9rem, 5vw, 3rem); font-weight: 750; }
h2 { font-size: clamp(1.3rem, 3vw, 1.75rem); font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 650; }
p { margin: 0 0 1em; }

:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
html[data-theme="dark"] :focus-visible { outline-color: var(--gold); }
.skip-link { position: absolute; left: -999px; top: 8px; background: var(--btn-bg); color: var(--btn-fg); padding: .6rem 1rem; border-radius: var(--r-sm); z-index: 100; }
.skip-link:focus { left: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { width: min(100% - 2rem, var(--wrap)); margin-inline: auto; }
.i { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Header ---------- */
.site-header { position: sticky; top: 0; z-index: 40; background: var(--brand); color: var(--on-brand); border-bottom: 1px solid rgba(255, 255, 255, .16); }
html[data-theme="dark"] .site-header { background: var(--bg); color: var(--ink); border-bottom-color: var(--line); }
.header-row { display: flex; align-items: center; gap: 1rem; min-height: 64px; }
.brand { display: inline-flex; align-items: center; gap: .6rem; text-decoration: none; font-family: var(--font-head); font-weight: 750; font-size: 1.1rem; letter-spacing: -.01em; }
.brand img { width: 34px; height: 34px; border-radius: 10px; }
.nav { display: none; margin-left: auto; gap: .25rem; }
.nav a, .nav button { text-decoration: none; padding: .55rem .95rem; border-radius: 999px; font-weight: 600; background: none; border: 0; cursor: pointer; }
.nav a:hover, .nav button:hover { background: rgba(255, 255, 255, .14); }
html[data-theme="dark"] .nav a:hover, html[data-theme="dark"] .nav button:hover { background: var(--surface); }
.nav a[aria-current="page"] { background: #FFFDF9; color: var(--brand); }
html[data-theme="dark"] .nav a[aria-current="page"] { background: var(--gold); color: var(--on-gold); }
.header-tools { display: flex; align-items: center; gap: .5rem; margin-left: auto; }
.chip { display: inline-flex; align-items: center; gap: .35rem; padding: .35rem .75rem; border-radius: 999px; background: rgba(255, 255, 255, .14); font-weight: 650; text-decoration: none; font-size: .95rem; }
html[data-theme="dark"] .chip { background: var(--surface); }
.icon-btn { display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; border: 0; background: none; cursor: pointer; }
.icon-btn:hover { background: rgba(255, 255, 255, .14); }
html[data-theme="dark"] .icon-btn:hover { background: var(--surface); }
.menu-panel { display: none; border-top: 1px solid rgba(255, 255, 255, .18); padding: .5rem 0 1rem; }
.menu-panel.open { display: block; }
.menu-panel a, .menu-panel button { display: flex; align-items: center; gap: .7rem; width: 100%; text-align: left; padding: .8rem .25rem; text-decoration: none; background: none; border: 0; font-weight: 600; cursor: pointer; border-radius: var(--r-sm); }
@media (min-width: 900px) {
  .nav { display: flex; }
  .header-tools { margin-left: 0; }
  /* keep the 3-line menu on desktop too: it opens as a dropdown under the header */
  .menu-panel { position: absolute; top: calc(100% + 6px); right: 1.25rem; width: 260px; padding: .5rem; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); color: var(--ink); box-shadow: 0 12px 32px rgba(0, 0, 0, .18); }
  .menu-panel a:hover, .menu-panel button:hover { background: var(--surface-2); }
  .menu-panel a, .menu-panel button { padding: .7rem .75rem; }
}

/* ---------- Mobile tab bar (mirrors the app-style navigation in the reference screenshots) ---------- */
.tabbar { position: fixed; inset: auto 0 0 0; height: var(--tabbar-h); z-index: 45; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar a, .tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .74rem; font-weight: 600; color: var(--muted); text-decoration: none; background: none; border: 0; cursor: pointer; }
.tabbar .i { width: 1.45rem; height: 1.45rem; }
.tabbar [aria-current="page"] { color: var(--ink); }
.tabbar [aria-current="page"] .i-wrap { background: var(--gold); color: var(--on-gold); }
.i-wrap { display: grid; place-items: center; width: 52px; height: 30px; border-radius: 999px; transition: background .2s; }
@media (min-width: 900px) { .tabbar { display: none; } body { padding-bottom: 0; } }

/* ---------- Buttons, cards, bits ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: .8rem 1.3rem; border-radius: 999px; border: 2px solid var(--btn-bg); background: var(--btn-bg); color: var(--btn-fg); font-weight: 650; text-decoration: none; cursor: pointer; transition: transform .15s, background .15s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn-gold { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.btn-sm { padding: .5rem .95rem; font-size: .92rem; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .55; cursor: not-allowed; transform: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 1.25rem; box-shadow: var(--shadow); }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
.stack > * + * { margin-top: 1rem; }
.section { padding: 2.5rem 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
.section-head a { font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .65rem; border-radius: 999px; background: var(--gold); color: var(--on-gold); font-size: .85rem; font-weight: 650; }
.pill.good { background: var(--good-bg); color: var(--good); }
.progress { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.progress > span { display: block; height: 100%; background: var(--gold); border-radius: inherit; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
html[data-theme="dark"] .progress > span { background: var(--gold); }

/* ---------- Home ---------- */
.hero { background: var(--brand); color: var(--on-brand); border-radius: 0 0 var(--r-lg) var(--r-lg); padding: 1.75rem 0 2.25rem; }
html[data-theme="dark"] .hero { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-top: 0; }
.hero-grid { display: grid; gap: 1.5rem; }
.greeting { font-weight: 600; opacity: .8; margin-bottom: .4rem; }
.hero h1 { max-width: 16ch; }
.stats { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.2rem; }
.stat { display: inline-flex; align-items: center; gap: .45rem; padding: .5rem .9rem; border-radius: 999px; background: rgba(255, 255, 255, .16); font-weight: 650; text-decoration: none; }
html[data-theme="dark"] .stat { background: var(--surface-2); }
.today-card { background: var(--surface); color: var(--ink); border-radius: var(--r-lg); padding: 1.5rem; box-shadow: var(--shadow); position: relative; }
html[data-theme="dark"] .today-card { background: var(--bg); border: 1px solid var(--line); }
.today-card .label { display: flex; align-items: center; justify-content: space-between; gap: .5rem; font-weight: 600; color: var(--muted); margin-bottom: .6rem; }
.today-card .quote { font-family: var(--font-read); font-size: clamp(1.15rem, 2.6vw, 1.45rem); line-height: 1.4; margin: 0 0 1.2rem; text-wrap: pretty; }
.today-card h2 { margin-bottom: .6rem; }
.ring { --p: 0; width: 76px; height: 76px; border-radius: 50%; background: conic-gradient(var(--gold) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; flex: none; }
html[data-theme="dark"] .ring { background: conic-gradient(var(--gold) calc(var(--p) * 1%), var(--line) 0); }
.ring span { width: 62px; height: 62px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-weight: 750; font-size: 1.05rem; line-height: 1; text-align: center; }
html[data-theme="dark"] .today-card .ring span { background: var(--bg); }
.ring small { display: block; font-size: .62rem; font-weight: 600; color: var(--muted); }
.banner { display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner[hidden] { display: none; }
.path { display: grid; grid-template-columns: repeat(6, 1fr); gap: .5rem; }
@media (min-width: 640px) { .path { grid-template-columns: repeat(10, 1fr); } }
.path a { aspect-ratio: 1; display: grid; place-items: center; border-radius: 12px; font-weight: 700; text-decoration: none; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.path a.done { background: var(--gold); color: var(--on-gold); border-color: var(--gold-deep); }
.path a.now { border: 2px solid var(--ink); color: var(--ink); }
html[data-theme="dark"] .path a.now { border-color: var(--gold); color: var(--gold); }
.path a.locked { opacity: .55; }
.two-col { display: grid; gap: 1.25rem; }
@media (min-width: 900px) {
  .hero-grid { grid-template-columns: 1fr 1.1fr; align-items: center; gap: 3rem; }
  .two-col { grid-template-columns: 1fr 1fr; }
  .hero { padding: 3rem 0 3.5rem; }
}

/* ---------- Devotional list ---------- */
.page-head { padding: 2rem 0 1rem; }
.filters { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1rem 0 1.25rem; }
.filters button { padding: .45rem 1rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
.filters button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); border-color: var(--gold-deep); }
.day-grid { display: grid; gap: .85rem; grid-template-columns: 1fr; list-style: none; padding: 0; margin: 0; }
@media (min-width: 600px) { .day-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 960px) { .day-grid { grid-template-columns: repeat(3, 1fr); } }
.day-card { display: flex; flex-direction: column; gap: .35rem; height: 100%; padding: 1.1rem 1.2rem; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); text-decoration: none; transition: border-color .15s, background .15s; }
a.day-card:hover { border-color: var(--ink); }
html[data-theme="dark"] a.day-card:hover { border-color: var(--gold); }
.day-card .top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-weight: 600; }
.day-card h3 { margin: 0; }
.day-card.current { background: var(--gold); color: var(--on-gold); border-color: var(--gold-deep); }
.day-card.current .top { color: var(--on-gold); opacity: .8; }
.day-card.locked { opacity: .6; }
.day-card .meta { margin-top: auto; padding-top: .5rem; font-size: .88rem; color: var(--muted); }
.day-card.current .meta { color: var(--on-gold); opacity: .8; }

/* ---------- Reader ---------- */
.reader { width: min(100% - 2rem, var(--read)); margin-inline: auto; padding: 1.25rem 0 3rem; }
.reader-top { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: 1rem; flex-wrap: wrap; }
.read-progress { position: fixed; top: 0; left: 0; height: 4px; background: var(--gold); width: 0; z-index: 60; }
html[data-theme="dark"] .read-progress { background: var(--gold); }
.reader h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); margin-bottom: .4rem; }
.reader .meta-line { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: 1.5rem; }
.prose { font-family: var(--font-read); font-size: calc(1.14rem * var(--fs, 1)); line-height: 1.75; text-wrap: pretty; }
.prose p { margin-bottom: 1.15em; }
.prose strong { font-weight: 650; }
.prose blockquote { margin: 1.4em 0; padding: .9em 1.2em; background: var(--gold-soft); border-left: 5px solid var(--gold-deep); border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.prose blockquote strong { font-weight: 500; }
.dose { background: var(--brand); color: var(--on-brand); border-radius: var(--r-lg); padding: 1.5rem; margin: 2rem 0; }
html[data-theme="dark"] .dose { background: var(--gold); color: var(--on-gold); }
.dose h2 { font-size: 1rem; margin-bottom: .5rem; }
.dose p { font-family: var(--font-read); font-size: 1.25rem; line-height: 1.5; margin: 0; font-weight: 600; }
.actions { display: grid; gap: .75rem; margin: 1.5rem 0; }
.action { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.1rem; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
.action.done { background: var(--good-bg); border-color: transparent; color: var(--good); }
.action strong { display: block; }
.action .sub { font-size: .9rem; color: var(--muted); }
.action.done .sub { color: inherit; }
.journal { margin-top: 1.5rem; }
.journal textarea { width: 100%; min-height: 11rem; padding: 1rem; border-radius: var(--r-md); border: 1.5px solid var(--line); background: var(--surface); font-family: var(--font-read); font-size: 1.05rem; line-height: 1.6; resize: vertical; }
.journal textarea:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--gold); }
.journal-foot { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: .6rem; flex-wrap: wrap; }
.day-nav { display: flex; justify-content: space-between; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; }
.complete-note { margin-top: 1.5rem; text-align: center; }
.locked-box { text-align: center; padding: 3rem 1rem; }

/* ---------- Leaderboard ---------- */
.me-card { background: #1C1714; color: var(--on-brand); border-radius: var(--r-lg); padding: 1.5rem; display: grid; gap: 1.25rem; }
html[data-theme="dark"] .me-card { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.me-rank { font-family: var(--font-head); font-size: clamp(3rem, 9vw, 4.5rem); font-weight: 800; line-height: 1; letter-spacing: -.03em; }
.me-rank small { font-size: 1rem; font-weight: 600; letter-spacing: 0; margin-left: .3rem; opacity: .75; }
.me-card .progress { background: rgba(255, 255, 255, .22); border-color: rgba(255, 255, 255, .3); }
.me-card .progress > span { background: var(--gold); }
html[data-theme="dark"] .me-card .progress { background: var(--surface-2); border-color: var(--line); }
html[data-theme="dark"] .me-card .progress > span { background: var(--gold); }
@media (min-width: 760px) { .me-card { grid-template-columns: auto 1fr; align-items: center; gap: 2.5rem; padding: 2rem 2.25rem; } }
.tabs { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.tabs button { padding: .45rem 1.1rem; border-radius: 999px; border: 0; background: none; cursor: pointer; font-weight: 650; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--gold); color: var(--on-gold); }
html[data-theme="dark"] .tabs button[aria-selected="true"] { background: var(--gold); color: var(--on-gold); }
.podium { display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; gap: .6rem; margin: 1.5rem 0; }
.podium .step { text-align: center; padding: .9rem .4rem 0; border-radius: var(--r-md) var(--r-md) 0 0; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; }
.podium .step.p1 { background: var(--gold); color: var(--on-gold); border-color: var(--gold-deep); padding-top: 1.4rem; }
.podium .step.p1 .base { height: 54px; }
.podium .step.p2 .base { height: 34px; }
.podium .step.p3 .base { height: 20px; }
.podium .base { margin-top: .8rem; background: rgba(26, 20, 16, .08); display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; }
.podium .name { font-weight: 650; overflow-wrap: anywhere; font-size: .95rem; padding-inline: .2rem; }
.podium .pts { font-size: .85rem; opacity: .8; }
.avatar { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); font-weight: 750; margin-bottom: .4rem; }
.step.p1 .avatar { background: var(--surface); color: var(--ink); width: 54px; height: 54px; }
.board { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
.row { display: grid; grid-template-columns: 2.4rem 1fr auto; align-items: center; gap: .75rem; padding: .8rem 1rem; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .rank { font-weight: 800; color: var(--muted); text-align: center; }
.row .who { display: flex; flex-direction: column; min-width: 0; }
.row .who b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .who span { font-size: .85rem; color: var(--muted); }
.row .score { font-weight: 800; text-align: right; }
.row .score small { display: block; font-weight: 500; color: var(--muted); font-size: .78rem; }
.row.you { background: var(--gold); color: var(--on-gold); position: relative; }
.row.you .rank, .row.you .who span, .row.you .score small { color: var(--on-gold); opacity: .8; }
.rules { display: grid; gap: .6rem; list-style: none; padding: 0; margin: 0; }
.rules li { display: flex; justify-content: space-between; gap: 1rem; padding: .7rem 0; border-top: 1px solid var(--line); }
.rules li:first-child { border-top: 0; }
.rules b { white-space: nowrap; }
@media (min-width: 900px) { .lb-layout { display: grid; grid-template-columns: 1.6fr 1fr; gap: 2rem; align-items: start; } .lb-side { position: sticky; top: 84px; } }

/* ---------- Footer ---------- */
.site-footer { background: var(--surface-2); border-top: 1px solid var(--line); margin-top: 3rem; padding: 2rem 0 1.5rem; }
.footer-grid { display: grid; gap: 1.5rem; }
@media (min-width: 760px) { .footer-grid { grid-template-columns: 1.5fr 1fr 1fr; } }
.site-footer ul { list-style: none; padding: 0; margin: 0; display: grid; gap: .4rem; }
.site-footer h2 { font-size: 1rem; }
.footer-bottom { border-top: 1px solid var(--line); margin-top: 1.5rem; padding-top: 1rem; font-size: .88rem; color: var(--muted); }

/* ---------- Dialog & toast ---------- */
dialog { border: 0; border-radius: var(--r-lg); padding: 1.5rem; width: min(92vw, 28rem); background: var(--surface); color: var(--ink); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .5); }
dialog::backdrop { background: rgba(14, 10, 8, .6); }
dialog label { display: block; font-weight: 650; margin-bottom: .3rem; }
dialog input[type="text"] { width: 100%; padding: .75rem .9rem; border-radius: var(--r-sm); border: 1.5px solid var(--line); background: var(--bg); }
dialog input[type="text"]:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--gold); }
.dialog-actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1.1rem; }
.toast-zone { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 14px); transform: translateX(-50%); z-index: 80; display: grid; gap: .5rem; width: min(92vw, 26rem); pointer-events: none; }
@media (min-width: 900px) { .toast-zone { bottom: 24px; } }
.toast { background: var(--btn-bg); color: var(--btn-fg); padding: .8rem 1.1rem; border-radius: var(--r-md); font-weight: 600; box-shadow: var(--shadow); animation: toast-in .3s ease-out; }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

@media print { .site-header, .tabbar, .site-footer, .actions, .journal, .day-nav, .toast-zone { display: none !important; } body { padding: 0; } }

/* small-screen fixes */
.tabs button { white-space: nowrap; }
.section-head { flex-wrap: wrap; }
.brand { white-space: nowrap; }
@media (max-width: 420px) { .brand { font-size: .86rem; gap: .4rem; } .brand img { width: 28px; height: 28px; } .header-row { gap: .5rem; } }

/* ---------- page colour ---------- */
body { background: var(--bg); }
html[data-theme="dark"] body { background: var(--bg); }
.site-header { background: var(--brand); }
html[data-theme="dark"] .site-header { background: var(--bg); }
.hero { background: var(--brand); }
html[data-theme="dark"] .hero { background: var(--surface); }
.podium .step.p1 .base { background: rgba(23, 21, 19, .2); }
html[data-theme="dark"] .podium .base { background: rgba(255, 255, 255, .07); }
html[data-theme="dark"] .podium .step.p1 .base { background: rgba(0, 0, 0, .18); }

/* ---------- 24-hour countdown states ---------- */
.wait { display: flex; align-items: center; gap: .6rem; margin: 0 0 1.2rem; padding: .75rem 1rem; border-radius: var(--r-md); background: var(--gold-soft); border: 1px dashed var(--gold-deep); font-weight: 600; }
html[data-theme="dark"] .wait { background: var(--surface-2); }
.wait b { font-variant-numeric: tabular-nums; }
.path a.waiting { border-style: dashed; border-color: var(--gold-deep); color: var(--ink); background: var(--gold-soft); }
.path a.locked { opacity: .5; }
.lock-badge { width: 72px; height: 72px; margin: 0 auto 1rem; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: var(--on-gold); }
.lock-badge .i { width: 32px; height: 32px; }
.big-count { display: block; margin-top: .3rem; font-variant-numeric: tabular-nums; font-size: clamp(2.4rem, 11vw, 3.6rem); }
.finish { margin-top: 2rem; }
.finish h2 { margin-bottom: .4rem; }
.finish .wait { margin-bottom: .8rem; }
.btn.is-disabled { opacity: .5; cursor: not-allowed; }
.day-card .meta b { font-variant-numeric: tabular-nums; color: var(--ink); }

/* ---------- You page / auth ---------- */
.you-wrap { padding: 2rem 0 1rem; display: grid; justify-items: center; }
.auth-card { width: min(100%, 30rem); padding: 1.5rem; }
@media (min-width: 600px) { .auth-card { padding: 2rem; } }
.btn-google { display: flex; align-items: center; justify-content: center; gap: .7rem; width: 100%; padding: .8rem 1rem; border-radius: 999px; border: 1.5px solid var(--line); background: #FFFDF9; color: #171513; font-weight: 650; cursor: pointer; transition: border-color .15s, transform .15s; }
.btn-google:hover { border-color: #171513; transform: translateY(-1px); }
.btn-google[disabled] { opacity: .6; cursor: wait; }
.divider { display: flex; align-items: center; gap: .8rem; margin: 1.2rem 0; color: var(--muted); font-size: .9rem; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.field { margin-bottom: 1rem; }
.field label { display: block; font-weight: 650; margin-bottom: .3rem; }
.field input { width: 100%; padding: .8rem .95rem; border-radius: var(--r-sm); border: 1.5px solid var(--line); background: var(--bg); font-size: 1rem; }
html:not([data-theme="dark"]) .field input { background: #FFFDF9; }
.field input:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--gold); }
.error-msg { margin: 0 0 1rem; padding: .7rem .9rem; border-radius: var(--r-sm); background: #FBE3D3; color: #8A2E0A; font-weight: 600; font-size: .95rem; }
html[data-theme="dark"] .error-msg { background: #4A2410; color: #F6C9AB; }
.link-btn { background: none; border: 0; padding: 0; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; color: var(--ink); }
.link-btn.warn { color: var(--warn); font-weight: 500; font-size: .92rem; }
.profile-head { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem; }
.avatar-lg { flex: none; display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: var(--gold); color: var(--on-gold); font-family: var(--font-head); font-weight: 800; font-size: 1.4rem; }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; text-align: center; }
.stat-grid > div { padding: .8rem .2rem; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); }
.stat-grid b { display: block; font-family: var(--font-head); font-size: 1.25rem; line-height: 1.1; }
.stat-grid span { font-size: .78rem; color: var(--muted); }
.profile-actions { display: grid; gap: .6rem; }
.me-card.guest { grid-template-columns: 1fr; }
@media (min-width: 760px) { .me-card.guest { grid-template-columns: 1fr auto; } }

.complete-wrap { margin: 1.6rem 0 .5rem; text-align: center; }
.complete-btn { width: 100%; }
.complete-btn[disabled] { opacity: 1; cursor: default; }
.complete-note { margin: .6rem 0 0; }

:where(html:not([data-theme="dark"])) .filters button { color: var(--ink); }
:where(html:not([data-theme="dark"])) .filters button[aria-pressed="true"] { color: var(--on-gold); }
:where(html:not([data-theme="dark"])) :is(.day-card.locked, .path a.locked, .j-item.locked) { opacity: .8; }
/* ---------- calm warm-white surfaces on the chocolate page (light mode) ---------- */
:where(html:not([data-theme="dark"])) :is(.j-item, .card, .today-card, .day-card, .path a, .board, .action, .podium .step, .tabbar, .tabs, .filters button, .wait, .reader, .locked-box, .stat-grid > div, .avatar, dialog) {
  --ink: #171513; --muted: #5F5954; --line: #D8CEC4; --bg: #FFFDF9; --gold-soft: #F3E9DF;
}
:where(html:not([data-theme="dark"])) :is(.j-item, .card, .day-card, .board, .action, .reader, .locked-box, .wait, .avatar, .stat-grid > div, .podium .step) { color: var(--ink); }
:where(html:not([data-theme="dark"])) .reader { background: #FFFDF9; border-radius: var(--r-lg); padding: 1.5rem 1.25rem 2.5rem; margin: 1rem auto 3rem; box-shadow: var(--shadow); }
@media (min-width: 640px) { :where(html:not([data-theme="dark"])) .reader { padding: 2rem 2.25rem 3rem; } }
:where(html:not([data-theme="dark"])) .btn:not(.btn-ghost):not(.btn-gold) { border-color: rgba(255, 253, 249, .3); }
:where(html:not([data-theme="dark"])) .site-footer { background: #1C1714; color: #FFFDF9; border-top: 0; }
:where(html:not([data-theme="dark"])) .site-footer .muted, :where(html:not([data-theme="dark"])) .site-footer .footer-bottom { color: #D8CEC4; }
:where(html:not([data-theme="dark"])) .site-footer .footer-bottom { border-top-color: rgba(255, 253, 249, .16); }
@media (min-width: 900px) { :where(html:not([data-theme="dark"])) .menu-panel { --ink: #171513; --muted: #5F5954; --line: #D8CEC4; } }

/* ---------- v15: lighter palette (light mode). Brown is now an accent, not the page. ---------- */
html:not([data-theme="dark"]) { --bg: #FBF8F3; --ink: #171513; --muted: #5F5954; --line: #E4DACE; --surface-2: #F5EFE7; }
html:not([data-theme="dark"]) .site-header { background: #FFFDF9; color: #171513; border-bottom: 1px solid #E4DACE; }
html:not([data-theme="dark"]) .nav a:hover, html:not([data-theme="dark"]) .nav button:hover,
html:not([data-theme="dark"]) .icon-btn:hover { background: rgba(107, 64, 38, .08); }
html:not([data-theme="dark"]) .nav a[aria-current="page"] { background: var(--brand); color: #FFFDF9; }
html:not([data-theme="dark"]) .chip, html:not([data-theme="dark"]) .stat { background: rgba(107, 64, 38, .09); }
html:not([data-theme="dark"]) .menu-panel { border-top-color: #E4DACE; }
html:not([data-theme="dark"]) .hero { background: #F3E9DF; color: #171513; }
html:not([data-theme="dark"]) .dose { background: #F3E9DF; color: #171513; border: 1px solid #E4DACE; }
html:not([data-theme="dark"]) .me-card .progress { background: rgba(255, 255, 255, .22); }
html:not([data-theme="dark"]) .tabbar { background: #FFFDF9; }

/* ============ v16: Lexend + calmer type scale + livelier surfaces ============ */
:root {
  --font-head: "Lexend", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-ui: "Lexend", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-accent: "Instrument Serif", Georgia, "Times New Roman", serif;
}
html { font-size: 93.75%; }                                /* 15px base: everything in rem gets a touch smaller */
body { font-size: 1rem; line-height: 1.6; letter-spacing: -.003em; font-weight: 400; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { letter-spacing: -.025em; }
h1 { font-size: clamp(1.75rem, 4.6vw, 2.7rem); font-weight: 700; line-height: 1.1; }
h2 { font-size: clamp(1.2rem, 2.6vw, 1.55rem); font-weight: 650; line-height: 1.2; }
h3 { font-size: 1rem; font-weight: 600; }
.brand { font-size: 1rem; font-weight: 650; }
.nav a, .nav button { font-size: .88rem; font-weight: 500; }
.chip { font-size: .85rem; font-weight: 550; }
.tabbar a, .tabbar button { font-size: .68rem; font-weight: 500; }
.btn { font-size: .9rem; font-weight: 550; padding: .75rem 1.25rem; letter-spacing: 0; box-shadow: 0 6px 16px -10px rgba(23, 21, 19, .55); }
.btn:hover { box-shadow: 0 10px 22px -10px rgba(23, 21, 19, .55); }
.btn .i { transition: transform .2s; }
.btn:hover .i { transform: translateX(3px); }
.btn-ghost { box-shadow: none; }
.btn-sm { font-size: .82rem; }
.small { font-size: .84rem; }
.pill { font-size: .75rem; font-weight: 550; }
.section-head h2 { margin: 0; }
.section-head a { font-size: .85rem; font-weight: 550; }

/* reading text: still scales with the A- / A+ buttons (--fs), the base is just re-tuned for the smaller rem */
.prose { font-size: calc(1.2rem * var(--fs, 1)); line-height: 1.75; }
.reader h1 { font-size: clamp(1.5rem, 4.4vw, 2.1rem); }
.dose p { font-size: 1.1rem; }
.today-card .quote { font-size: clamp(1rem, 2.3vw, 1.2rem); }
.journal textarea { font-size: 1rem; }

/* small label pill */
.eyebrow, .greeting { display: inline-flex; align-items: center; gap: .5rem; padding: .32rem .8rem; border-radius: 999px; font-size: .72rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; background: rgba(107, 64, 38, .1); color: var(--gold-deep); margin: 0 0 1rem; }
.eyebrow::before, .greeting::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgba(168, 115, 75, .22); }
html[data-theme="dark"] .eyebrow, html[data-theme="dark"] .greeting { background: rgba(168, 115, 75, .16); color: var(--gold-deep); }
.accent { font-family: var(--font-accent); font-style: italic; font-weight: 400; font-size: 1.14em; letter-spacing: -.01em; color: var(--gold-deep); }
html:not([data-theme="dark"]) .hero .accent { color: #8C5C38; }

/* hero: soft glow + rings instead of a flat block */
.hero { position: relative; overflow: hidden; isolation: isolate; }
.hero::before { content: ""; position: absolute; z-index: -1; width: 420px; height: 420px; right: -120px; top: -160px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(168, 115, 75, .38), rgba(168, 115, 75, 0) 70%); }
.hero::after { content: ""; position: absolute; z-index: -1; width: 300px; height: 300px; left: -110px; bottom: -150px; border-radius: 50%; border: 1.5px solid rgba(107, 64, 38, .22); box-shadow: 0 0 0 28px rgba(107, 64, 38, .05), 0 0 0 58px rgba(107, 64, 38, .035); }
.hero p { color: var(--muted); }
html[data-theme="dark"] .hero::after { border-color: rgba(168, 115, 75, .3); }

/* cards: lift on hover */
.card, .day-card, .action, .j-item, .path a, .stat-grid > div, .step-card, .stat-tile { transition: transform .22s cubic-bezier(.2, .8, .2, 1), box-shadow .22s, border-color .2s, background .2s; }
a.day-card:hover, .action:hover, .j-item:hover, .card:hover, .step-card:hover { transform: translateY(-3px); box-shadow: 0 16px 30px -18px rgba(60, 35, 20, .45); }
.path a:hover { transform: translateY(-2px) scale(1.04); }
.today-card { box-shadow: 0 24px 50px -28px rgba(60, 35, 20, .55); border: 1px solid rgba(107, 64, 38, .12); }
.day-card h3 { font-size: .98rem; line-height: 1.3; }
.ring span { font-size: 1rem; }

/* scroll reveal (no JS; browsers without scroll-timeline just show everything) */
@keyframes uw-rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
@keyframes uw-fade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.hero .wrap > div { animation: uw-fade .7s both; }
.hero .today-card { animation: uw-fade .7s .12s both; }
@supports (animation-timeline: view()) {
  .reveal { animation: uw-rise linear both; animation-timeline: view(); animation-range: entry 0% entry 35%; }
}
@media (prefers-reduced-motion: reduce) { .reveal, .hero .wrap > div, .hero .today-card, .marquee-track { animation: none !important; } }

/* thin scrolling values strip */
.marquee { overflow: hidden; background: var(--brand); color: #FFFDF9; padding: .7rem 0; border-block: 1px solid rgba(255, 255, 255, .12); margin-top: 1.25rem; }
.marquee-track { display: flex; width: max-content; gap: 2.2rem; animation: uw-marquee 32s linear infinite; font-size: .8rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }
.marquee-track span { display: inline-flex; align-items: center; gap: 2.2rem; white-space: nowrap; }
.marquee-track span::after { content: "\2726"; color: #D9B48F; font-size: .8em; }
@keyframes uw-marquee { to { transform: translateX(-50%); } }

/* sections: heading block + step cards + stat tiles */
.sec-title { max-width: 30rem; margin-bottom: 1.4rem; }
.sec-title p { color: var(--muted); margin: .4rem 0 0; }
.steps { display: grid; gap: .9rem; }
@media (min-width: 760px) { .steps { grid-template-columns: repeat(3, 1fr); gap: 1.1rem; } }
.step-card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 1.4rem 1.3rem 1.5rem; overflow: hidden; }
.step-card .num { font-family: var(--font-accent); font-style: italic; font-size: 3rem; line-height: 1; color: var(--gold); opacity: .85; margin-bottom: .6rem; display: block; }
.step-card h3 { font-size: 1.05rem; margin-bottom: .3rem; }
.step-card p { margin: 0; font-size: .88rem; color: var(--muted); }
.step-card::after { content: ""; position: absolute; right: -40px; bottom: -40px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(168, 115, 75, .2), rgba(168, 115, 75, 0) 70%); }
.stat-band { display: grid; grid-template-columns: repeat(2, 1fr); gap: .8rem; }
@media (min-width: 760px) { .stat-band { grid-template-columns: repeat(4, 1fr); } }
.stat-tile { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 1.1rem 1rem; text-align: center; }
.stat-tile b { display: block; font-family: var(--font-head); font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
.stat-tile span { display: block; font-size: .78rem; color: var(--muted); margin-top: .25rem; }
.verse { position: relative; background: #1C1714; color: #FFFDF9; border-radius: var(--r-lg); padding: 2rem 1.5rem; overflow: hidden; }
.verse::before { content: "\201C"; position: absolute; top: -.2em; left: .35rem; font-family: var(--font-accent); font-size: 9rem; line-height: 1; color: rgba(217, 180, 143, .22); }
.verse blockquote { position: relative; margin: 0; font-family: var(--font-accent); font-size: clamp(1.5rem, 4.4vw, 2.3rem); line-height: 1.2; }
.verse blockquote em { color: #D9B48F; }
.verse cite { position: relative; display: block; margin-top: 1rem; font-style: normal; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: #D8CEC4; }
.cta-band { text-align: center; background: var(--gold-soft); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 2.2rem 1.25rem; }
html[data-theme="dark"] .cta-band { background: var(--surface); }
.cta-band h2 { font-size: clamp(1.4rem, 4vw, 2rem); max-width: 18ch; margin-inline: auto; }
.cta-band p { color: var(--muted); max-width: 36ch; margin: 0 auto 1.2rem; }
.cta-row { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; }

/* ============ v17: Lora for the devotional reading text ============ */
:root { --font-read: "Lora", Georgia, "Times New Roman", serif; }
.prose { font-size: calc(1.16rem * var(--fs, 1)); line-height: 1.8; }
.prose strong { font-weight: 600; }

/* ---------- Daily prayer ---------- */
.prayer { margin: 1.5rem 0; padding: 1.25rem 1.3rem; border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: var(--r-md); background: var(--surface-2); }
.prayer h2 { font-size: 1rem; margin-bottom: .5rem; }
.prayer p { font-family: var(--font-read); font-style: italic; line-height: 1.65; margin: 0; }

/* Streak info card */
button.chip{border:0;font:inherit;font-size:.85rem;font-weight:550;color:inherit;cursor:pointer}
.streak-pop{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);right:12px;z-index:60;width:min(300px,calc(100vw - 24px));box-sizing:border-box;padding:1rem 1.1rem;border-radius:14px;background:#FFFDF9;color:#1C1714;border:1px solid rgba(107,64,38,.25);box-shadow:0 10px 30px rgba(28,23,20,.22);font-size:.92rem;line-height:1.45}
.streak-pop[hidden]{display:none}
.streak-pop h3{margin:0 0 .4rem;font-size:1rem;display:flex;align-items:center;gap:.4rem;color:#6B4026}
.streak-pop p{margin:.35rem 0;color:#1C1714}
.streak-pop .streak-now{font-weight:650}
.streak-pop button{margin-top:.5rem;padding:.45rem .9rem;border-radius:999px;border:0;background:#1C1714;color:#FFFDF9;font:inherit;font-size:.85rem;cursor:pointer}
html[data-theme="dark"] .streak-pop{background:#1F1B18;color:#F3EDE5;border-color:rgba(255,253,249,.2)}

  function dayKey(ts) { var d = new Date(ts); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }

  var Store = {

    /** Time (ms since epoch) when a day opens. 0 = open now, Infinity = previous day not read yet. */

    allRead: function () { return Store.daysRead() >= CONFIG.totalDays; },
    total: function () { return load().log.reduce(function (a, e) { return a + e.pts; }, 0); },
    weekPoints: function () {

      });

  var Auth = {
    mode: CONFIG.firebase ? 'firebase' : 'local',
    user: function () { return user; },

    signUp: function (name, email, pw) {

    signIn: function (email, pw) {

    user = null;   // stale Firebase session cached while Firebase is not configured
  }

  /* ================= CLOUD SYNC (Firestore) =================
     Progress is saved to the signed-in account, and every reader's points are published to a shared
     "leaderboard" collection, so the ranking is the same on every phone. */
  var cloudError = '', cloudBoard = null, pushTimer = null, refreshing = null, pulledFor = null, fsPromise = null;
  function cloudOn() { return Auth.mode === 'firebase'; }
  function fsdb() {
    if (fsPromise) return fsPromise;
    fsPromise = fb().then(function (f) {
      if (f.db && f.d) return { db: f.db, d: f.d };

  }
  function shortName(n) {

          x.d.setDoc(x.d.doc(x.db, 'users', u.uid), { progress: s.progress, log: s.log, progressAt: Date.now() }, { merge: true })
        ]);

  function pullCloud(u) {

  }
  function refreshBoard() { return Promise.resolve(); }   /* shared leaderboard removed */
  function refreshBoardUnused() {
    if (!cloudOn()) return Promise.resolve();

      });
    } else if (CONFIG.showSampleParticipants) {
      SAMPLE.forEach(function (s, i) {
        list.push({ id: 's' + i, name: s[0], points: weekly ? s[2] : s[1], streak: s[3], days: Math.min(CONFIG.totalDays, Math.max(1, Math.round(s[1] / 28))), you: false });
      });
    }
    if (user) {
      var mine = weekly ? Store.weekPoints() : Store.total();
      if (mine || !cloudOn()) list.push({ id: 'you', name: cloudOn() ? shortName(user.name) : user.name, points: mine, streak: Store.streak(), days: Store.daysRead(), you: true });
    }
    list.sort(function (a, b) { return b.points - a.points || (a.you ? 1 : 0) - (b.you ? 1 : 0); });
    list.forEach(function (e, i) { e.rank = i + 1; });
    return list;
  }

  var Board = {
    entries: entries,
    refresh: refreshBoard,
    error: function () { return cloudError; },
    levelFor: levelFor,
    me: function (period) { return entries(period).filter(function (e) { return e.you; })[0] || null; },
    rankDelta: function () {
      var me = Board.me('all'); if (!me) return 0;
      var s = load(), prev = s.lastRank; s.lastRank = me.rank; persist();
      return prev ? prev - me.rank : 0;
    }
  };

  /* ================= UI HELPERS ================= */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function icon(name) { return '<svg class="i" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }

    '<symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v6a4 4 0 01-8 0zM8 6H4v1a4 4 0 004 4M16 6h4v1a4 4 0 01-4 4M12 14v4M8 21h8M10 18h4"/></symbol>' +
    '<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol>' +

    '<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>' +

    '<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>' +
    '<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>' +

    '<symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3h11a1 1 0 011 1v16a1 1 0 01-1 1H6zM6 3v18M10 8h5M10 12h5"/></symbol>' +

    '</svg>';

  var NAV = [
    { id: 'home', label: 'Home', href: 'index.html', icon: 'home' },
    { id: 'devotional', label: 'Devotional', href: 'devotional.html', icon: 'book' },
    { id: 'journals', label: 'Journals', href: 'journals.html', icon: 'note' },
    { id: 'you', label: 'You', href: 'you.html', icon: 'user' }
  ];

  var MENU_EXTRA = [{ id: 'story', label: 'Our story', href: 'story.html', icon: 'book' }];

  function renderHeader(page) {
    var links = NAV.map(function (n) { return '<a href="' + n.href + '"' + (n.id === page ? ' aria-current="page"' : '') + '>' + n.label + '</a>'; }).join('');
    var menuLinks = NAV.concat(MENU_EXTRA).map(function (n) { return '<a href="' + n.href + '"' + (n.id === page ? ' aria-current="page"' : '') + '>' + icon(n.icon) + n.label + '</a>'; }).join('');
    return '<header class="site-header"><div class="wrap"><div class="header-row">' +
      '<a class="brand" href="index.html"><img src="LOGO_URI" width="34" height="34" alt="Unconventional Wisdom logo">' + CONFIG.siteName + '</a>' +
      '<nav class="nav" aria-label="Main">' + links + '</nav>' +
      '<div class="header-tools"><button class="chip streak-chip" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Your streak in days. Tap for info">' + icon('flame') + '<span data-points>0</span></button>' +
      '<button class="icon-btn menu-toggle" type="button" aria-expanded="false" aria-controls="menu-panel" aria-label="Open menu">' + icon('menu') + '</button></div></div>' +
      '<div class="menu-panel" id="menu-panel">' + menuLinks +
      '<button type="button" data-theme-toggle>' + icon('moon') + '<span data-theme-label>Dark mode</span></button></div></div></header>';
  }

  function renderTabbar(page) {
    return '<nav class="tabbar" aria-label="Primary">' + NAV.map(function (n) {
      return '<a href="' + n.href + '"' + (n.id === page ? ' aria-current="page"' : '') + '><span class="i-wrap">' + icon(n.icon) + '</span>' + n.label + '</a>';
    }).join('') + '</nav>';
  }

  function renderFooter() {
    var y = new Date().getFullYear();
    return '<footer class="site-footer"><div class="wrap"><div class="footer-grid">' +
      '<div><a class="brand" href="index.html"><img src="LOGO_URI" width="34" height="34" alt="" loading="lazy">' + CONFIG.siteName + '</a>' +
      '<p class="muted small" style="margin-top:.8rem;max-width:32ch">A practical 30-day devotional for leaders and builders to learn godly wisdom.</p></div>' +
      '<div><h2>Explore</h2><ul>' + NAV.concat(MENU_EXTRA).map(function (n) { return '<li><a href="' + n.href + '">' + n.label + '</a></li>'; }).join('') + '</ul></div>' +
      '</div><div class="footer-bottom">&copy; ' + y + ' ' + CONFIG.siteName + '. All rights reserved.</div></div></footer>';
  }

  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('uw:theme', t); } catch (e) {}
    document.querySelectorAll('[data-theme-label]').forEach(function (el) { el.textContent = t === 'dark' ? 'Light mode' : 'Dark mode'; });
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#171513' : '#FFFDF9');
  }

  var toastZone;
  function toast(msg) {
    if (!toastZone) {
      toastZone = document.createElement('div');
      toastZone.className = 'toast-zone';
      toastZone.setAttribute('aria-live', 'polite');
      document.body.appendChild(toastZone);
    }
    var t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    toastZone.appendChild(t);
    setTimeout(function () { t.remove(); }, 4200);
  }

  function goSignIn(next) { location.href = 'you.html' + (next ? '?next=' + encodeURIComponent(next) : ''); }

  function wireStreak() {
    var chip = document.querySelector('.streak-chip');
    if (!chip || chip.dataset.wired) return;
    chip.dataset.wired = '1';
    var pop = document.createElement('div');
    pop.className = 'streak-pop'; pop.hidden = true;
    pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', 'About your streak');
    document.body.appendChild(pop);
    function close() { pop.hidden = true; chip.setAttribute('aria-expanded', 'false'); }
    function open() {
      var n = Store.streak();
      pop.innerHTML = '<h3>' + icon('flame') + 'Your reading streak</h3>' +
        '<p>The flame shows how many days in a row you have read the devotional.</p>' +
        '<p>Read one day each day to add 1 to your streak. If you miss a day, it starts again from 1.</p>' +
        '<p class="streak-now">Current streak: ' + n + (n === 1 ? ' day' : ' days') + '</p>' +
        '<button type="button">Got it</button>';
      pop.querySelector('button').addEventListener('click', close);
      pop.hidden = false; chip.setAttribute('aria-expanded', 'true');
    }
    chip.addEventListener('click', function (e) { e.stopPropagation(); if (pop.hidden) open(); else close(); });
    document.addEventListener('click', function (e) { if (!pop.hidden && !pop.contains(e.target)) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  }

  function wire() {
    wireStreak();
    var toggle = document.querySelector('.menu-toggle'), panel = document.getElementById('menu-panel');
    if (toggle && panel) {
      toggle.addEventListener('click', function () {
        var open = panel.classList.toggle('open');
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        toggle.innerHTML = icon(open ? 'close' : 'menu');
      });
    }
    document.addEventListener('click', function (e) {
      if (e.target.closest('[data-theme-toggle]')) applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });
    function refreshPoints() { document.querySelectorAll('[data-points]').forEach(function (el) { el.textContent = Store.streak(); }); }
    document.addEventListener('uw:change', refreshPoints);
    refreshPoints();
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');

    // live countdowns: any element with data-unlock-day ticks every second
    setInterval(function () {
      var els = document.querySelectorAll('[data-unlock-day]');
      if (!els.length) return;
      var expired = false;
      els.forEach(function (el) {
        var ms = Store.msUntil(parseInt(el.getAttribute('data-unlock-day'), 10));
        if (ms <= 0) expired = true; else el.textContent = fmt(ms);
      });
      if (expired) fire('uw:change');
    }, 1000);
  }

  function init() {
    var page = document.body.dataset.page;
    document.body.insertAdjacentHTML('afterbegin', SPRITE);
    var logo = (document.querySelector('link[rel="icon"]') || {}).href || '';
    var h = document.getElementById('site-header'); if (h) h.outerHTML = renderHeader(page).replace(/LOGO_URI/g, logo);
    var f = document.getElementById('site-footer'); if (f) f.outerHTML = renderFooter().replace(/LOGO_URI/g, logo);
    document.body.insertAdjacentHTML('beforeend', renderTabbar(page));
    wire();
    fire('uw:ready');
  }

  window.UW = { CONFIG: CONFIG, POINTS: POINTS, LEVELS: LEVELS, Store: Store, Board: Board, Auth: Auth, esc: esc, icon: icon, toast: toast, fmt: fmt, goSignIn: goSignIn };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
<script>
/* Devotional content: Unconventional Wisdom, 30-Day Devotional. d=day, t=title, b=body paragraphs (HTML), x=dose, m=minutes to read */
window.UW_DAYS=[{"d":1,"t":"What Is Wisdom?","b":["<strong>Proverbs 24:14 (AMP) - Know that [skillful and godly] wisdom is [so very good] for your life and soul; if you find wisdom, then there will be a future and a reward, and your hope and expectation will not be cut off.</strong>","The Scriptures don’t give a straightforward definition of Wisdom. I guess this also shows how unique Wisdom is. It takes Wisdom to know the definition of Wisdom.","Let’s first look at the general meaning of Wisdom from the dictionary. <strong>The</strong> <strong>Oxford English Dictionary says “Wisdom is the capacity of judging rightly in matters relating to life and conduct.” </strong>The Scripture also describes Wisdom as the principal thing. For a thing to be termed “principal,” it must be more important than many other things we call important.","<strong>If we are going to talk about what Wisdom is, then we must also consider what Wisdom is not. </strong>Wisdom is not just knowledge or the accumulation of knowledge, and it is not understanding alone, though all of these are attributes of Wisdom. It is not morality (being of good morals or composure), neither is it knowing good from bad or right from wrong. You can have two right things and still not be able to choose wisely.","Wisdom is not academia or being a scholar. Wisdom is not merely saying or knowing something uncommon from what others know. It can be uncommon and still not be wise. It can sound deep and still not be wise.","In general, Wisdom can simply be defined as the right and practical application of knowledge gained: the ability to apply it towards a course of action and make sound decisions. Wisdom is the end result of having knowledge, understanding how that knowledge works, and applying it practically to your life.","Wisdom from the lens of God is the ability to apply the knowledge of the word of God and the person of God towards a course of action and make sound decisions."],"x":"Wisdom is not knowledge, neither is it understanding. But when you have knowledge and understand how to apply it practically, you are a step closer to gaining wisdom.","m":2,"p":"Lord, as I proceed into reading and meditating on this devotional, bring me into Wisdom: the kind of wisdom that can only be found in You, that gives me a future and a hope, with insights on how to position myself for the times ahead."},{"d":2,"t":"What Is Unconventional Wisdom?","b":["<strong>1 Cor 2:6 (TPT) - However, there is a wisdom we speak of when we are among the spiritually mature. It’s wisdom that didn’t originate in this present age, nor did it come from the rulers of this age who are in the process of being dethroned.</strong>","This kind of Wisdom is not common. And it is going to be the subject of discussion in this devotional. Unconventional Wisdom in the context of this devotional is the true wisdom that has its origin in God and is rooted in Him.","When men operate in this kind of wisdom, men call them DIFFERENT OR EXCEPTIONAL. But at first they appear FOOLISH because they are most likely choosing a path or making a decision they aren’t used to, most likely a path entirely different from the one people have attached their names to, until they realize it works.","This is the wisdom that goes against the norm. The kind that isn’t self-dependent but has its total dependency on God. Imagine being told that depending on someone is Wisdom. That’s the unconventionality of this wisdom. If someone is being called Wise, the natural human brain thinks “They know all things”, “they have it all figured out” and “<strong>They depend on no one for wisdom</strong>”.","But the unconventional wisdom is a kind of wisdom that originates from God and a man who will operate in it has to be totally dependent on God. If you hate the phrase “dependency on God,” you might want to reconsider whether you still want to go on with this devotional. This devotional is for those who are willing to come to the point of dependency on God, for Wisdom especially.","Therefore,<strong> Unconventional Wisdom can be defined as the wisdom that has practically mastered the act of bringing heaven’s order to the realm of men, through daily dependency and submission to God.</strong>","<strong>Mallory Smyth defined Wisdom </strong>this way, and it resonates perfectly with the kind of wisdom we are talking about<strong> - “Wisdom is seeing things from God’s perspective and applying that perspective to our lives.”</strong>","You can’t predict a man who is operating in this kind of wisdom because he has access to the ultimate Source of true wisdom and is yielded to Him. He walks in unconventional ways that the wisdom of the world cannot fathom.","Those who have gotten hold of this unconventional wisdom from God don’t execute like others do. They defy the norm.","Take the case of Jesus, for example. The Scripture says, “If the princes of this world had known, they wouldn’t have crucified Him” <em>(paraphrasing 1 Cor 2:8)</em>. The normal wisdom was this: “When someone dies, that’s the end of his journey.” So, in their limited mind and wisdom, crucifying Him was the end. But the all-wise God, in His unconventional wisdom, said, “That was a grand plan, and never the end.” The death was just the beginning of an entire plan. And to this day, that wisdom still baffles those who are used to conventional wisdom. It never makes sense to their logical mind. They want to connect the dots, but the conventional mind that isn’t yielded to the Spirit is limited. But to those of us who believe, it has become the power of God and we can testify that there is a wisdom that surpasses the norm and we are beneficiaries of it."],"x":"Unconventional Wisdom can be defined as the wisdom that has practically mastered the act of bringing heaven’s order to the realm of men, through daily dependency and submission to God.","m":3,"p":"Lord, bring me into the wisdom that is above the wisdom of this age. Let Your wisdom come with grace to teach me to say “No” to ungodliness."},{"d":3,"t":"Is the World Foolish?","b":["<strong>James 3:14-15 - But, if you harbor bitter envy and selfish ambition in your hearts, do not boast about it or deny the truth. 15 Such wisdom does not come down from heaven, but is earthly, unspiritual, of the devil.</strong>","There is something called Earthly Wisdom and, it must be said, this kind of wisdom produces results too. And one thing about anything that produces results is this: “Those benefitting from it never believe or accept that there is anything better than it”.","You know how people like to joke, “You cannot advise someone who is in love” (in the context of romance). For one reason or another, in many cases, their sense of judgment is clouded, especially if they are immature minds. You can genuinely advise them based on the signals you’ve seen, and they will go ahead and report you to their partner. Then they make you the villain in their story, until they finally see it for themselves and say, “Oh! This person told me.” I refuse to continue on this subject <em>(laughs).</em> This also sometimes applies to someone who is getting results from the wrong sources or using the wrong approach. You can’t advise them otherwise. Because they will tell you “But I am getting results”. And truth be told, they are actually getting rewarded even in the error or folly. Getting results sometimes doesn’t equate to being wise.","The world has its own wisdom, and the Scripture testifies to that. It most times originates from three sources: common sense, natural knowledge and the devil. Just by virtue of being human, you have the ability to know the difference between good and bad. Hence the term “common sense.” But it’s a pity that common sense is no longer common in this generation because devilish wisdom has dominated.","The scripture confirms the status of the world’s wisdom in 1 Corinthians 3:18-19. It says, “Do not deceive yourselves.<strong> If any one of you thinks he is wise by the standards of this age, he should become a fool, so that he may become wise.” </strong>","And you might be wondering, “Become a fool so he can become wise? Like, really? Is it that bad?” It is actually that serious.","<strong>Why? </strong>","<strong>Because the wisdom of this world is foolishness in God’s sight. </strong>What this world calls wisdom and finds appealing is, most times if not all the time, foolishness when placed side by side with the Wisdom of God. So, judge what you call wisdom."],"x":"The world has its own wisdom, for a fact. But what this world calls wisdom and finds appealing is, most times if not all the time, foolishness when placed side by side with the Wisdom of God.","m":2,"p":"Lord Jesus, in any area where I have borrowed ideologies from the world and held on to them as wisdom from You, save me and bring me into the knowledge of Your truth again."},{"d":4,"t":"Differentiate Between Unconventional and Earthly Wisdom, Pt. I","b":["<em>James 3:14-15 - But, if you harbor bitter envy and selfish ambition in your hearts, do not boast about it or deny the truth. 15 Such wisdom does not come down from heaven, but is earthly, unspiritual, of the devil</em>","Earthly wisdom is full of self-ambition and envy. It’s always self-seeking, and that’s why it never agrees with the word “depending on God for anything”. This wisdom indoctrinates men to do only what benefits them. It encourages selfishness, and the most surprising thing is that people who encourage or engage in this kind of wisdom boast about it because it has been normalized. It feels good and sounds appealing. They even package it as self-help courses. But if you check the results it is producing, you will realize it is causing more damage than help.","Wherever there is envy and selfish ambition, there can’t be godliness. And where there is no godliness, there is chaos and every form of evil practice.","Don’t be surprised at what people call wisdom in this generation. It all started with selfish ambition: wisdom that tells you to live only for yourself, to prioritize yourself, and, even when you help others, to do so only because of what you stand to gain.","It is wisdom that instructs you to build a community not because you genuinely have the heart to see others grow, or even to see them win more than you, but because you need them to climb your ladder of success. You need them to worship you and fuel your ego, making you feel like a god.","<strong>How can you know if you are operating in earthly wisdom?</strong>","There are many ways to check, but the one I’ll talk about is this: when the motive behind everything you do is self. It is self-seeking and self-glorifying, with no regard for God’s purpose in it. On the outside it might look like you are helping people, but deep down, you know you are just using them to crush your goals and tick your boxes."],"x":"The wisdom that tells you to live only for yourself and prioritize yourself is Earthly. It says that even when you live for others, it should be because of what you stand to gain. Earthly Wisdom is selfish and self-ambitious.","m":2,"p":"Lord, rid me of selfishness that has masqueraded as ambition and purpose. If there is any way in me that is not pleasing to You, take it away. Help me to yield myself in alignment with You."},{"d":5,"t":"Differentiate Between Unconventional and Earthly Wisdom, Pt. II","b":["<strong>James 3:17 - But the wisdom that comes from heaven is first of all pure, then peaceloving, considerate, submissive, full of mercy and good fruit, impartial and sincere </strong>","Yesterday you read about Earthly Wisdom and a few of its characteristics. Today, we’ll continue by looking at how the Unconventional Wisdom (Godly) stands out from earthly wisdom.","One of the main characteristics of the earthly wisdom is SELF. It is self-seeking and takes glory in being independent of God (either loudly or subtly, through actions). But Godly Wisdom, on the other hand, has its origin in God. Because God is pure, this wisdom is pure and without guile. Because God gives out of love, godly wisdom gives out of genuine love.","A man who operates in this Godly wisdom we are talking about considers the interest of others in whatever he does, while putting God first. He cares about what is in it for others and not just for himself.","Godly wisdom produces fruits that aren’t alien to God. A good tree will not produce bad fruit. Only a bad tree produces bad fruit.","James said in <em>James 3:13</em>, and I quote, “Who is wise and understanding among you? Let him show it by his good life, by deeds done in humility that comes from wisdom.”","You can differentiate Godly wisdom from earthly wisdom this way: “Godly Wisdom originates from God and doesn’t alienate God. It produces the kind of fruits and deeds that God can produce because it is rooted in, totally dependent on and not separated from God”. If God is not selfish, that means His wisdom cannot be selfish. If God is all-wise, that means His wisdom encompasses all things and cuts across all areas of life."],"x":"Godly wisdom produces fruits that aren’t alien to God. Anything that cannot be found in God cannot be found in it. So, if YOU claim to have Godly Wisdom but the fruits or results of that wisdom are alien to the ways of God, check that wisdom.","m":2,"p":"Lord, make me rise above the standards of the world’s wisdom and come into the level of Your wisdom. Enlighten my heart, my spirit and my soul. Bring me into the wisdom and understanding that the Spirit gives. From today onward, let me begin to produce the fruits of godly wisdom."},{"d":6,"t":"Wisdom as the Foundation of Creation","b":["<strong>Prov. 8:29c-30 - …and when He marked out the foundations of the earth. Then I was the craftsman at His side.</strong>","The day I saw this scripture, I understood better why gaining Godly Wisdom is truly important, and why the world’s wisdom, in all of its explorations, can be called nothing but foolishness when compared to it.","When you look at the earth in all its beauty and splendor, sometimes it even raises questions in your heart and you’ll ask, “Why is the sun hanging somewhere up there? How did we even get here? What exactly happens in the womb before a fetus can become a whole baby?”","There’s an ancient wisdom that was before the world began (Prov. 8:22). When God wanted to start the work of creation, do you know what He did? He created wisdom first.","Then He allowed wisdom to do the work of craftsmanship (Prov. 8:30). All He needed to do afterwards was give commands: “Let there be…” (Gen 1:3). And Wisdom went on with the craft. If Wisdom could craft out the world, it says something about Wisdom and creativity you need to pay attention to.","How the world came to be and the different evolutions that have happened aren’t alien to Him. If you think about it deeply, this Wisdom is looking like it has a personality - He can actually sit and craft. It goes beyond an abstract thing you just sense or feel. It shows there’s a lot to unpack in God’s Wisdom and what you think you have access to is little compared to what you can enjoy in God. Imagine having a partnership with this Wisdom that existed even before the world was created.","I’m not an advocate for seeking things that go beyond what you can handle or seeking the mysteries that no one has unpacked, just out of untamed curiosity. Even Wisdom helps you know the kind of mysteries to seek and those you don’t have business with (I explain this better in one of the next doses). But all I want to emphasize to you in today’s read is that The Wisdom from God is the best partner and foundation you can have if you want to create things that outshine the world’s wisdom and benefit humanity."],"x":"The revelation of God’s wisdom is progressive. The highest of God’s wisdom you have enjoyed before is the least you can enjoy. There is depth and riches in the wisdom of God. Be hungry for more! But allow wisdom to guide your hunger so you don’t land in places you don’t have any business with.","m":2,"p":"Oh, the depth of the riches of God’s wisdom! How unsearchable are Your ways; Your ways are past finding out. But Your Word also tells me that You reveal these things to those You love. Lord, just like Daniel, help me to experience You as the Revealer of mysteries. Reveal Your wisdom to me for the days ahead. Reveal Your wisdom for the things to come and my part to play in them."},{"d":7,"t":"Jesus Christ: The Wisdom of God","b":["<strong>John 1:2-3 NIV - He (Jesus) was with God in the beginning with God. Through Him (expressed as Wisdom) all things were made; without Him nothing was made that has been made. (</strong><em>Words in the brackets are emphasized by me)</em>","Solomon, the main writer of Proverbs, has been acknowledged as the wisest man on earth (and no one has been able to break his record, save Jesus). One of the wealthiest kings that ever existed, he testified of Wisdom as the craftsman that sat with God during the creation of the world.","Another testimony came: John 1:2-3 - The Word was with God in the beginning, and through Him all things were made; without Him nothing was made that has been made.","And remember yesterday we talked about Wisdom being the craftsman that was at God’s side from the beginning (Prov 8:22, 30).","You will realize Solomon wasn’t describing himself in Prov. 8; he was describing someone he had fellowship with. If there was anyone that could tell us about Wisdom, I think Solomon is in the best position. The testimony of John also buttressed what Solomon described Wisdom to be. Are you thinking what I’m thinking?","All this points to the fact that “We cannot separate the subject of Wisdom from its true meaning”. CHRIST IS THE WISDOM OF GOD. The revelation of who Christ is brings us into the Wisdom of God.","God uses the foolish things of this world to confound the wise. The life of Jesus and how everything played out was one of those foolish things. But see what God made out of what seemed like foolishness to men. It became our SALVATION, our POWER.","If you have tasted the other side and you genuinely encounter Jesus, you can testify to this “THERE’S SOMETHING ABOUT GENUINELY ENCOUNTERING JESUS”. It makes so much difference that is unexplainable. My life is a testament. I wonder what I would be doing with my life now if I hadn’t truly encountered Jesus. Probably just going with the flow and rhythm of the world, not being able to tell what is Wisdom from what would ruin me.","Imagine a virgin giving birth. Imagine the crucifixion of Christ, which they thought was the end. Human wisdom even expected Christ to come from a royal and very powerful background, but the entirety of the coming of Christ to the world disrupted those who attribute Wisdom to logic, to what makes sense only in the head. It rendered logical reasoning useless and came in a way that surpasses natural wisdom."],"x":"The revelation of who Christ is brings you into the WISDOM of God. If you genuinely find Jesus, you’ve found the Wisdom of God.","m":2,"p":"Jesus, help me to know You genuinely. You embody the wisdom of God; help me to become like You. Lord, reveal Yourself to me afresh. Bring me into the light and revelation of You, better than I have ever known. Help me to experience You as Wisdom."},{"d":8,"t":"The Beginning of Wisdom","b":["<strong>Prov. 9:10 (NIV) - The Fear of the Lord is the beginning of Wisdom; the knowledge of the Holy One is understanding.</strong>","The passage above is one of the most popularly quoted scriptures, and yet understanding of it is lacking. Another passage says “The Fear of the Lord, that is Wisdom…”<em>(Job 28:28)</em>. I’m in awe because the Word of God just made us understand that <strong>all you are trying to do to come into wisdom legitimately is fulfilled in this one thing - “To Fear the Lord.”</strong>","There is no point talking about unconventional wisdom if this passage “Proverbs 9:10” will be sidelined. If we say something is the beginning of a thing, do you know what it means? It means the rest cannot exist if this does not exist.","True wisdom cannot be gained outside of the fear of the Lord. <strong>For this <em>Unconventional Wisdom </em>we are talking about, the fear of the Lord is the starting point</strong>. To walk in wisdom is to reverence the Giver of wisdom. You don’t treat Him like a distant boss you don’t have access to. You don’t treat Him like a side project. You don’t treat Him as someone whose opinion you seek only when everything is on the verge of falling apart.","<strong>What does it really mean to “Fear the Lord”?</strong>","One passage that gives an insight into it is this: “Trust in the Lord with all your heart, and do not lean on your own understanding. In all your ways acknowledge Him, and He will make your paths straight” <em>(Prov. 3:5-6)</em>.","It is a conscious decision you make where you now say “I might have understanding, but I embrace Yours. I might have knowledge, but I acknowledge You in it.” To fear the Lord is to revere Him and to acknowledge Him and His words. You take Him at His word and do not trivialize His words.","<strong>To Fear the Lord is to acknowledge Him as a higher authority over you and believe in His supremacy.</strong> For in Him you live, move and have your being. Without Him, there’s literally NO LIFE. Let’s not take it too far. Think about the breath in your nostrils as the first example of Life.","<strong>Wisdom starts from acknowledging the superiority of God’s word over your own opinions.</strong> It starts from knowing God and His beautiful ways - because He created wisdom and wisdom originates from Him.","It’s similar to wanting to learn how Anthropic developed Claude AI but deciding to bypass the founder.","When you try to find Wisdom outside of God, what you get is earthly wisdom, common sense and twisted truth.","<strong>To fear the Lord, that’s the first step to living a life of Wisdom</strong>. But to fear Him is not equivalent to knowing Him. There’s a further step to be taken, which is coming into the knowledge of Him [The knowledge of the Holy One is understanding…<em>Prov. 9:10</em>]."],"x":"Unconventional Wisdom begins with Reverence for God. Reverence brings you into the knowledge of Him, then understanding of Him. Understanding plus obedience to His precepts forms true wisdom in you.","m":2,"p":"I give You the first place in my life, Lord. Help me to trust You with all my heart and not lean on my own understanding. I take on the mind of Christ in reverence and obedience to You. I come into wisdom through obedience."},{"d":9,"t":"Getting Wisdom","b":["<strong>Proverbs 4:7 (KJV) Wisdom is the principal thing. Therefore get Wisdom. And in all your getting, get understanding. </strong>","<strong>James 1:5 (NKJV) - If any of you lacks wisdom, let Him ask God, who gives to all men liberally and without reproach, and it will be given to Him. </strong>","God is willing to disburse Wisdom to men. He gives freely, but not anyhow.","God gives His wisdom to all men, but there is a right heart posture for receiving it. Let’s check Solomon, the wisest man as a case study. Solomon had the privilege to ask for power, wealth and riches, but he asked for Wisdom. It takes a man with the right heart posture to delay gratification the way Solomon did. He knew the importance of Wisdom and that every other thing he could ever ask for is embedded in Wisdom, though it might not come instantly.","It’s similar to receiving salvation. As much as salvation is free and for all men, you have to believe and confess with your mouth the Lordship of Jesus. Wisdom works similarly. You have to love Wisdom, desire it and want more than just the conventional.","Wisdom comes to those who love and seek her <em>(Prov. 8:17)</em>. Wisdom comes to those who acknowledge they lack it and then proceed to ask God <em>(James 1:5)</em>.","Unconventional Wisdom doesn’t dwell with those who already think they know. If you desire Godly Wisdom, that is, this Unconventional and true Wisdom we are talking about, then you will have to ask with your own mouth. Wisdom cannot be imparted by a man; it is given to those who seek and can steward it.","But when you ask, you must believe and not doubt, because he who doubts is like a wave of the sea, blown and tossed by the wind. That man should not think he will receive anything; he is a double-minded man, unstable in all he does <em>(James 1:6-7).</em>","Wisdom comes with a lot of family members, as I mentioned previously. It attracts many other good things and it takes a man who has yielded to God to steward them rightly without destroying himself. This again is why the subject of the fear of God cannot be separated from the topic of Wisdom."],"x":"God is willing to give wisdom freely to all men, but you must be willing to receive. LOVE wisdom, SEEK wisdom, ASK GOD for wisdom.","m":2,"p":"I ask, and I receive wisdom. I seek wisdom, and I find wisdom. I believe strongly in my heart that God gives to all men liberally and without finding fault. Wisdom becomes the anchor of my life, in Jesus’ name."},{"d":10,"t":"Attributes of a Wise Man","b":["<strong>1 Kings 3:7 - “Now, O Lord my God, you have made me king instead of my father, David, but I am like a little child who doesn’t know his way around.” NLT </strong><em>(Heart posture)</em>","<strong>1 Kings 3:9 - So give your servant a discerning heart to govern your people and to distinguish between right and wrong. For who is able to govern this great people of yours? NIV </strong><em>(Humility to acknowledge his need for God)</em>","If we were to list these attributes the conventional way, we could go on and on listing all the moral behaviours that are widely acceptable in society. But that’s not it.","While writing this part, the Holy Spirit directed my attention to use Solomon as a case study, portraying two core attributes of a wise man. After choosing Solomon and committing His agenda into Solomon’s hands, the Lord required him to ask for whatever he wanted God to give him. The agenda: to rule God’s people and lead them to Him.","Solomon’s request and words revealed a lot, two of which are stated in the two Bible passages above. You can read through 1 Kings 3:7-9 and meditate on them. Solomon said and I paraphrase “You have given me this, but I acknowledge I’m but a child. I can’t do this without you. I don’t have the wisdom to run this on my own”.","<strong>Solomon portrayed an Attribute that is becoming rare amongst us in this generation - HUMILITY as a heart posture. </strong>Solomon could have easily banked on the doses of wisdom his father David had administered to him before his death, he could have banked on what he had seen work in David’s time, he could have copied verbatim and felt confident in himself enough to lead the people. But he said <strong>“I am like a little child…”</strong> He might not even have been a little child by age, but humility is a heart posture. <strong>It takes a humble man to acknowledge the need for help regardless of age.</strong>","<strong>Another core attribute I believe covers for every other aspect is what Solomon asked for - A DISCERNING HEART.</strong>","This thing called discerning heart is core. It is a core attribute for a wise man. God in the awesomeness of His wisdom didn’t walk with Solomon the exact way He did with David. Yet, both of them were wise and did extremely great things for God. Imagine Solomon hadn’t been discerning and had just decided to go with David’s way; he would have done well as an exact copy of David but would not have tapped into the Unconventional route God wanted to take him through in their journey together.","Life is in phases. We are faced with different situations in life that we aren’t even prepared for. A Discerning Heart is key to navigating life with wisdom. Every other attribute is connected to this. A Discerning heart helps you know when to act innoc
