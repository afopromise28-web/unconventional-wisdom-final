ent, when to be shrewd, when to be slow in action, when to strike with speed, when to go all out, when to lock in, what instructions to discard no matter how well-meaning they are and which voice of instruction (from men and from spirits) to listen to.","<strong>A Discerning Heart! </strong>Solomon said, “Give your servant a discerning heart…to <strong>distinguish between right and wrong</strong>,” and I add <strong>“...to distinguish between good and God.”</strong> Because sometimes, it’s not a question of “right and wrong”, it is a question of “Is it just right or is it what God wants?” A discerning heart fetches you an answer.","<strong>As you read this today, I want you to take an actionable step immediately:</strong>","If you are already walking in this gift of a discerning heart, I want you to say this prayer: “Holy Spirit, fan this gift into flame in me. Increase the intensity so I can be more discerning. Heighten the level of my discernment.”","If you’ve never really seen a need for a discerning heart or have never experienced what it means until now, as you read this, I want you to do this:","<strong>Say this: “Holy Spirit, give me a discerning heart. I can’t know it all by head knowledge. Bless me with a discerning heart so that I can walk in unconventional wisdom.”</strong>"],"x":"The core attributes of a wise man are humility (as a heart posture) and a discerning heart. Every other attribute builds on this.","m":4,"p":"Holy Spirit, give me a discerning heart. I can’t know it all by head knowledge. Bless me with a discerning heart so that I can walk in unconventional wisdom. Help me to take on a heart posture of humility as I engage with You and with others. Bring me into the consciousness that my entire life hinges on You, and that I am who I am because You made me."},{"d":11,"t":"Wisdom in Character","b":["<strong>Prov 8:12-13 - I, wisdom, dwell together with prudence, I possess knowledge and discretion…I hate pride and arrogance, evil behaviour and perverse speech. Counsel and sound judgement are mine; I have understanding and power.</strong>","It saddens my heart to see young people, leaders, builders and professionals, occupying a certain space for Jesus (either as a Leader, pioneer or supporter), full of fire and anointing, and when you come into close contact with them, you are shocked, because their character is the exact opposite of what they teach or preach.","I know we are not perfect by human definitions. I’m not perfect either. But I believe we all should actively work towards perfection and we can always tell when someone genuinely wants to grow or when they’ve become full of themselves and resistant to correction.","<strong>If you and I speak in the tongues of men, have oratory prowess and can even speak in the tongues of angels and have no LOVE, we are nothing but a resounding gong or a clanging cymbal. </strong>That is, our impact and contributions are nothing but noise.","I have realized that the basis of everything we do is <strong>LOVE. </strong>To leave an indelible mark in people’s lives and influence them the right way, LOVE is required. You can’t serve people “<strong>GENUINELY</strong>” if you don’t love them. Remember I emphasized “genuinely”. It takes compassion rooted in Love to see a set of people, bear their pains and want to do whatever it takes to help them out of it. Jesus exemplified this kind of Leadership.","<strong>Maybe the reason you want to work for God and identify your brand with Jesus is just so you can gain influence and feel important. Check your motives.</strong>","Because if you are truly yielded to Him, you will want to be like Him in character, in words and in ways. Not just when you are in the limelight.","<strong>Maybe your motive for wanting to be a Leader is just to become influential and use others as a ladder to achieve your own goals, not genuinely to see their lives change. Scrutinize your motive. </strong>Because what you’re building might not be able to stand the test of time.","If we can all get the basics right, which is carrying the consciousness of LOVE, it will shape everything else we do. It refines our character.","If you love God, you will want to fellowship with Him and obey His commands.","If you love others, you won’t do to them what you can’t tolerate.","If you love God and others, you won’t always prioritize things that will benefit you alone. You won’t be self-seeking.","If you have Love, you’ll be kind, patient, humble. You won’t seek only things that benefit you, your mantra won’t be: “So far it doesn’t affect me, I don’t care what others feel or think”. You won’t boast, be proud or keep records of wrong. You’ll be quick to listen and slow to speak or get angry. <strong>You won’t only respect people who can offer you something</strong>. You’ll give people grace and have hope in them (see their potential). And in doing so, character will be formed in you.","This is unconventional wisdom, not the kind of wisdom that says “Do only what benefits you”, “Go for only what makes you feel good without considering others”."],"x":"LOVE is foundational to coming into the character of Wisdom. Love compels you into wise character.","m":3,"p":"Lord, continue Your surgical work in me. Save me from a double-standard life. Let everyone who comes in contact with me experience Christ through my conduct and character. Whether in public or in private, let me live like You. Don’t let me become a blessing to outsiders while the people around me suffer. Help me to experience You as Love, so I can show love to others."},{"d":12,"t":"Wisdom in Action","b":["<strong>James 3:13 (NIV) - Who is wise and understanding among you? Let them show it by their good life, by deeds done in humility that comes from wisdom.</strong>","You can never separate Wisdom from action.","We don’t know a wise man by what he says alone, but by what he does. A man is not wise because he calls himself so (not even in a world where everyone now has access to information). Anybody can talk, but wisdom is proven by her actions.","A wise man is not eager to teach what he is not willing to practise. Certain teachers who themselves have not enrolled in the school of wisdom are those who usually say “Do what I say, but don’t do what I do.” Some don’t even say it, but their lifestyle screams “Do what I say, but don’t do what I do”. True Wisdom, on the other hand, will confidently say “Do what I do”.","Your life, and most especially your words, must align with your actions. This is one of my anchor scriptures when it comes to taking action. It is what James wrote to the twelve tribes: “<strong>Do not merely listen to the word and so deceive yourselves</strong>. Anyone who listens to the word but does not do what it says is like a man who looks at himself in a mirror, goes away and immediately forgets what he looks like…”<em>(James 1:22-24)</em>. (Pause and picture that.)","Wisdom is not known by knowledge alone, but by your actions birthed from understanding. The Wisdom of God teaches your hands diligence, not laziness, because Wisdom Himself was the craftsman at creation. With diligence and creativity, He crafted the earth and all that is within it <em>(Prov 8:30).</em>","If you store up knowledge and never act on it, it never results in wisdom. Wisdom reflects in your deeds, because out of the abundance of Wisdom in you, your deeds speak."],"x":"Wisdom goes beyond knowledge to understanding, and from understanding to taking the right actions. Wisdom is proven by actions. Wisdom is knowing what to do and doing it.","m":2,"p":"Lord, I know more than I do. I know Your Word but fail to practise it as I ought to. Most of the limitations I experience are the result of my inability to take the right actions or to obey when necessary. I still struggle with procrastination and doubt. Lord, bring me into wisdom for taking action. Strengthen my feeble hands and let this weakness become my greatest strength. By Your strength, I take the right actions today and immediately."},{"d":13,"t":"Wisdom in Action, Pt. II","b":["<strong>James 1:25 - But the man who looks intently into the perfect law that gives freedom…and continues to do…not forgetting what it says will be blessed by what he does.</strong>","If you now know from the scriptures that Wisdom is a craftsman, what are you doing with that knowledge?","If you know that walking in Wisdom starts with acknowledging God, reverencing Him and choosing to partner with Him, what are you doing with that knowledge?","Don’t claim to know God and deny Him by your actions. Wisdom gives you the ability not just to know a thing, but to understand it enough to use it to benefit others, make sound judgement and take the right actions.","Don’t be ever learning, but never coming into the knowledge of the truth. Show me your wisdom without actions, and I’ll show you that what you’ve acquired is only head knowledge.","Faith produces deeds! Deeds produce results! Results produce Track Record! And Track Record solidifies your Faith!","David said <strong>“Your servant has been keeping his father’s sheep. When a lion or a bear came and carried off a sheep from the flock, I went after it, struck it and rescued the sheep from its mouth. When it turned on me, I seized it by its hair, struck it and killed it.” </strong><em>(1 Sam. 17:34). </em>This track record made David believe so strongly that he could defeat Goliath.","Remember, <strong>there’s no track record without taking the first step of Faith. Note that I said FAITH, not self-acclamation.</strong>","It is a step of Faith because God said it and He is instructing you to move in that direction. It is not a step of Faith just because you want it at all cost (even when God is saying otherwise)."],"x":"Wisdom is proven by her actions. What are you doing with what you know? Wisdom is knowing what to do and doing it.","m":2,"p":"In every area of my life where my actions keep contradicting the words I profess, Lord, realign me. Bring me into the wisdom of how to build a track record. Help me not to shy away from the things You are bringing my way to grow my capacity. I come up higher through yieldedness and obedience that cause me to take action."},{"d":14,"t":"Wisdom in Words","b":["<strong>Titus 2:7-8 (NIV) -...in your teaching, show integrity, seriousness and soundness of speech that cannot be condemned, so that those who oppose you may be ashamed because they have nothing bad to say about you <em>(Emphasis: mine)</em></strong>","Words are the content of Wisdom. And True Wisdom finds her root in God’s word. Words are channels that can lead a man’s heart somewhere - either lead it to life or lead it astray. Words can truly motivate. Even the words spoken from common sense can make people feel good for a while. But the words that transform humans and make their lives better cannot but trace back to their origin, which is God.","Learning public speaking without wisdom is digging a path to amplify your foolishness to the world someday.","Focusing on better presentation while neglecting the contents of the word is like beautifying the fences of your house without beautifying your rooms.","<strong>In your teaching</strong>,<strong> show…soundness of speech that cannot be condemned</strong>,<strong> so that those who oppose you may be ashamed because they have nothing bad to say about you</strong> <em>Titus 2:7- 8</em>","Can you read that line again “<em>show…soundness of speech that cannot be condemned, so that those who oppose you may be ashamed because they have nothing bad to say about you?”</em>","Your teachings should be seasoned with so much wisdom that almost nothing in them can be condemned.","As you are building community and sharing your process, impacting young lives and all sorts, never forget this. If people are ever going to drag you online, let it be because of the truth you stood for and were never willing to compromise. Let it never be because of one foolish thing you said, which the Holy Spirit Himself is even convicting you of while you are still justifying it.","The truth is you cannot totally control what people’s response will be to whatever you share or teach. But never give them room to be justified. Let it be that they disagreed because they found it controversial, not because it was folly.","Let’s take the case of Daniel as an example.","<strong>Daniel 6:4 - </strong>At this, <em>the administrators and the satraps tried to find ground for charges against Daniel</em> in his conduct of government affairs, but <em>they were unable to do so</em>. <em>They could find no corruption in him</em> because he was trustworthy and neither corrupt nor negligent.","Daniel was involved in government affairs and these people wanted to find charges against him just to bring him down, but they found nothing - as in nothing. Not even his words? Not even his speech? Nothing! Except for his love for God. If you read a bit further, to verse 5, you will see that Daniel showed us that you can be wise even in your speech and people will come for you with the aim of bringing you down, but they will find nothing except for your love for God."],"x":"Words are the content of Wisdom. True Wisdom finds her root in God’s word. Show soundness of speech that cannot be condemned in all you do, so that those who oppose you may be ashamed because they found nothing to condemn you for except the fact that you love God.","m":2,"p":"Lord, I truly know the power of words, as the Scriptures confirm that You honour Your Word above Your name. Teach my tongue to speak with grace, and help my heart to meditate on that which is true. Let Your Word be shed abroad in my heart so I can speak from the abundance of it. As You help me grow and increase in wisdom, let my words never be a tool the devil can leverage to pull me down. Bridle my tongue. Let my words edify."},{"d":15,"t":"Words of Wisdom and Folly","b":["<strong>Prov. 9:4 - “Let all who are simple (simple-mindedness, not false humility) come in here!”</strong>","<strong>Prov. 9:13 - The woman folly is loud, she is undisciplined and without knowledge.</strong>","Wisdom speaks “worthy, right, just and true”. But folly speaks “lies, wickedness, perverse and crooked words,” void of grace yet presented as ‘true’.","How then can we differentiate between the words of wisdom and folly?","<strong>Wisdom says “Let all who are simple (simple-mindedness, not humility) come in here!” (Prov. 9:4).</strong> This was an invitation to bring those who have been living without wisdom (the simple) to wisdom. Wisdom invites others to Life and what makes them better. One of the ways we can know a wise man is by the kind of instructions he listens to. And the kind of instructions he listens to has a great influence on the kind of instruction he will also give.","If the wisdom of God is the one instructing you and influencing your thoughts, what comes out of you is life and health to others. This is again why reverence for God cannot be excused from the subject of Wisdom.","<strong>Listen to what Folly has to say to her audience</strong>. Folly is what can be represented as Earthly Wisdom in this sense. <strong>She tells her audience “Stolen water is sweet, and food eaten in secret is delicious…” (Prov. 9:17)</strong>. When they hear it, they are excited and they even shout “deep”. It actually looks like wisdom; it sounds different from what they would normally hear. And this is where people miss it. <strong>Just because it sounds deep or different from what you are used to doesn’t mean it’s wisdom</strong>. If it doesn’t find its root in God, it is still foolish.","What looks like wisdom to them was actually an invitation into destruction. She was inviting them into fornication, death and the depths of the grave. <strong><em>Prov. 9: 17.</em> </strong>Little do they know that the dead are there, that her guests are in the depths of the grave.","Wisdom, on the other hand, was inviting them to Life."],"x":"The words of Wisdom invite others to Life, while Folly disguises herself as Life but digs the grave of destruction for those who listen to her words.","m":2,"p":"From today onward, my speech is guarded by wisdom. Let my words invite men into life. Help me not to fall victim to destructive words disguised as wisdom. Help me to discern who to listen to and whose words to learn from. Above all, let Your Word have the highest authority over my life."},{"d":16,"t":"Wisdom in Knowledge Seeking","b":["<strong>Prov. 18:15 (ESV) - An intelligent heart acquires knowledge, and the ear of the wise seeks knowledge.</strong>","<strong>Prov. 19:2 (ESV) - Desire without knowledge is not good, and whoever makes haste with his feet misses the way.</strong>","Consumption of knowledge alone doesn’t equate wisdom, though it can aid it. Knowledge in itself is a tool that can make or break you.","Have you ever learnt something new, perhaps while reading a book or taking a course, and suddenly felt more knowledgeable than others, or even started to see them as ignorant and couldn’t listen to them anymore? It happens. This is one of the things knowledge can do to an untamed man.","In knowledge seeking, wisdom tells us to go for the right knowledge based on occasion and demands. Not all kinds of knowledge.","Am I saying you should be air-headed and never go for knowledge? No. What we are learning is acquisition of the right knowledge and avoiding knowledge that can mar you or your knowledge of God.","<strong>Avoid knowledge that can mar you.</strong> Avoid any knowledge that attacks your dependence on God and faith in His words. Avoid any knowledge that makes you think you don’t need God to figure life out.","1 Corinthians 8:1 …<strong>we know that “all of us possess knowledge”</strong>. <em>This knowledge puffs up. Then, Prov.2:6 For the Lord gives wisdom, from his mouth comes knowledge and understanding </em>","Many of us know a thing or two. You know something; no argument. But this same knowledge can puff you up and make you so confident in yourself and your abilities, whereas in the real sense you are being given. True knowledge that can make you comes from the mouth of the Lord, from His words. Any knowledge that cannot trace its origin back to God’s Word, the teachings of His Spirit, or perhaps the natural principles He has laid down does not mean well for you. Check it: it never produces life."],"x":"Don’t be an air-headed Leader or builder. Seek knowledge, desire knowledge, inquire after knowledge. Wisdom is needed to discern between the knowledge that can make or mar you. Any kind of knowledge that doesn’t have its root in God will mar you.","m":2,"p":"I come into the right knowledge needed to be who God has called me to be. Knowledge saves me, vindicates me and sets my life on the right trajectory. By the wisdom of God, I know where to find the right knowledge, and I am able to discern the knowledge that can misalign me."},{"d":17,"t":"Wisdom to Build, Pt. I","b":["<strong>Heb. 3:3 - …the builder of the house is more important than the house itself. For every house is built by someone, but God is the builder of everything.</strong>","You are more important to God than every project He has given you or will give you to build.<strong> YOU ARE THE FIRST PROJECT </strong>and God is able to trust you with other projects because you have first allowed Him to work on you as a project. Don’t be so engrossed in the projects while neglecting the truth that you are the first project He delights in building.","<strong>DDK (Debola Deji Kurunmi) said something and it stayed with me up till now.</strong> She said <em>“Don’t desire to conquer territories for the Lord when you haven’t first become the territory He conquers”.</em> That’s profound!","You must come to the understanding that God doesn’t rate men based on the work, and more work, they can do. Your identity isn’t first about what you can do but what He did for you. It is in response to what He did that you can now do. If Christ had never done anything, all the work, building and kingdom advancement we are trying to do would have amounted to self-righteousness.","<strong>If God is the builder of everything, and the builder is more important than the house itself (now from the second context), </strong>then He deserves your attention more than the project He has given you to build.","Any project you are building that can compete with God’s place in your heart, check it! That project might be taking your worship, and that is not God’s intention for building.","<strong>The order:</strong>","- <strong>The builder of the house builds you first, and continues to do so.</strong>","- He gives you project(s) to build, with Him as the foundation.","- You allow the project to stand firm on the right foundation He has laid for you.","<em>A building without a firm foundation will soon collapse at the slightest of rain.</em>"],"x":"YOU ARE THE FIRST PROJECT that God is so delighted in building before committing projects into your hands. Every assignment He has given you is an opportunity to grow.","m":2,"p":"Lord, I recognise that I am the first project You are interested in building. Help me always to prioritise who I am becoming in You more than what I am doing for You. Let no assignment ever take Your place in my heart. Let fellowship with You always be fresh, whether You assign me a project to work on or not."},{"d":18,"t":"Wisdom to Build, Pt. II","b":["<strong>Luke 14:28 - Suppose one of you wants to build a tower. Won’t you first sit down and estimate the cost to see if you have enough to complete it?</strong>","<strong>Gal 3:3 - Are you so foolish? After beginning with the spirit? Are you now trying to attain your goal by human effort?</strong>","You prayed for ideas, a vision, an identity in Him. The idea came or He revealed your identity to you and the next thing you want to do is announce on social media and start prepping your audience just to impress them. You haven’t first sat down and counted the cost. You didn’t even remember to ask again “How do you want me to execute?”","If the Spirit initiated the idea or prompted the vision, then the strategy for execution still lies with Him. This doesn’t mean you don’t have a part to play anymore. After all, you are still the one who will execute it and how well it will be executed depends on you. But the Holy Spirit (finding expression as Wisdom) is capable of giving you instructions and guidance on how to execute rightly.","When He gives you an idea to build on, your first action should not be to start running. Running without knowing how best He wants you to execute is dangerous. Be diligent enough to receive it completely. He has the execution template. The exception is overthinkers like Gideon, who, even after receiving the instruction and the backing of God through His word, will still ask, “Lord, are you sure? Give me a sign to convince me.”","Let the one who started it guide you. Don’t be too quick to assume you know what to do next. In a world where we are advised to take action immediately at all times, I know this might be a hard pill to swallow. But the word of God says “Count the cost”. Be wise enough to know when to strike and when to delay gratification. And if the world didn’t give you the assignment, they can’t determine when you should execute.","So, if you claim the Spirit of Wisdom initiated it, then you must learn to allow Him to lead the journey all the way through, from ideation to execution."],"x":"When you receive an idea, instruction or vision, sit down and count the cost. This is not time-specific. Be wise enough to know when to act urgently and when to delay gratification.","m":2,"p":"The trap of trying to complete, with my own knowledge, what You started in me is very subtle. Lord, help me to give Your Spirit first place in my decisions and actions. Let me never get to the point where I feel sufficient in myself to oversee my life. I receive the wisdom to build Your way."},{"d":19,"t":"Wisdom to Build on the Already-Laid Foundation","b":["<strong>1 Cor. 3:10 <em>NIV </em>- By the grace God has given me, I laid a foundation as a wise builder, and someone else is building it. But each one should build with care.</strong>","<strong>1 Cor. 3:11 <em>NIV </em>- For no one can lay any foundation other than the one already laid, which is Jesus Christ.</strong>","When I started writing this devotional in March, I hadn’t really grasped what today’s topic meant. The theme “Building on the Already-Laid Foundation” means a lot of things. But I learnt a dimension of it by experience<strong>. </strong>The Lord had to teach me this Himself.","I love to move and to be constantly in motion - you know, as in “MOVING MAN,” as everyone in the online space has been calling themselves now. I’m not afraid of moving, but I’m afraid of moving in a direction that doesn’t align with God’s plans for me.","The days of ignorance can be easily overlooked. The days of feeding on milk as babes in Faith. God could easily overlook moving in the wrong direction, and it would be counted as “Oh! She didn’t know.” But what about the part where “He has trained you, He is training you, He has made you a son and conferred responsibilities on you”? He has stated clearly what is required of you and what He desires to make out of you. Yet you decide to move in the wrong direction?","God, as a loving Father, will still show mercy and re-route you to the right path. But I don’t think that will be without discipline, because you actually know better and aren’t doing it. The discipline isn’t a result of hate, but a way to shape your heart posture to become more like Him - to become a son indeed!","<strong>After starting the devotional and already sharing a glimpse of the launch online, He took me into a season of quietness. A season of stillness. A season of learning (by experience). I think this season really did a lot to my heart and shaped my willingness to want more of Him in all humility, not just for what people can see.</strong>","<strong>What is the Already-Laid Foundation?</strong>","<strong>1 Cor. 3:11 <em>NLT</em>-</strong> For no one can lay any foundation other than the one we already have—Jesus Christ.","<strong>2 Tim 2:19 <em>NLT</em> - </strong>But God’s truth stands firm like a foundation stone with this inscription: “The Lord knows those who are his,” and “All who belong to the Lord must turn away from evil” (<strong>folly</strong>)<strong>.</strong>","There’s an approach to building in God’s kingdom. It is this: God is of more priority than any assignment. Every assignment is to the end that Jesus is revealed. If what He wants you to build is of greater significance to you than He is, then your priority is already misplaced. He loves to work with those He can entrust with things. He knows those who are His, and those who are His are completely yielded to Him."],"x":"Every assignment He has given you has an end goal: that Jesus is revealed and glorified. This is the already-laid foundation. Build on it.","m":3,"p":"Lord, teach me Your ways more. Never let me grow into compromise, where I justify what You reject just because it suits my desires. Teach me the approach to building Your way. I want to build, contribute to the growth of my world and partner with You to establish Your will on this realm of men. Help me to learn from the life of Jesus and build on the foundation You have laid."},{"d":20,"t":"Wisdom to Get Wealth, Pt. I","b":["<strong>Deuteronomy 8:18 <em>NIV</em> - But remember the Lord your God, for it is He who gives you the ability to produce wealth, and so confirms His covenant…</strong>","Let’s set the record straight again; this devotional is for those who want to gain wisdom as it applies to every aspect of their lives, but the unconventional way. It is Unconventional Wisdom because it is not the common wisdom widely accepted by the world, but it is God’s standard.","<em>…for it is He who gives you the ability to produce wealth…</em>","As someone to whom the Lord has committed a portion of an assignment, you need to see this scripture in the light that God sees it. The Lord has opened your heart to bear certain burdens that are in His heart, He has placed you as a leader to serve a certain people, and He has committed ideas into your hands that He wants to birth through you, but you haven’t reckoned with His words concerning wealth. If you still struggle to sit comfortably in discussions when the topic switches to wealth, then you need to start from that foundational level.","Get into the Word and soak yourself in the passages where God has spoken about wealth. Learn about wealth from God’s perspective. And this is one of the things this devotional is doing for you.","If you don’t see the need for wealth or understand what God has said about wealth, then everything I am saying here might not make complete sense to you. But the fact that you haven’t come into the light yet doesn’t mean God hasn’t promised it or made it available for you. Reckon with this first.","But just like Paul said, and I paraphrase, <strong>“I know what it means to be in need and what it means to have abundance, but in all of these I have learnt contentment and neither lack nor plenty affects or predicts my love for God.”</strong> That’s the balance. Wealth is not what qualifies you for the assignment or shows that God is happy with you. But, wealth is one of the promises that accompanies the assignment. Never join them in arguing about “whether God wants believers to be wealthy.” Read the scripture for yourself and see His promises."],"x":"God promised wealth and He also gives to those who are His the ability to produce wealth.","m":2,"p":"Lord, first work on my heart. Enlighten me more and bring me into an understanding of wealth from Your perspective. Search out the deceits of the devil in my heart that make me live lower than my identity in You. Bring me into the knowledge of my inheritance so that I can start to use it. Give me the ability to produce wealth."},{"d":21,"t":"Wisdom to Get Wealth, Pt. II","b":["<strong>Deut 8:18 </strong><em>(NIV) </em>- <strong>But remember the Lord your God, for it is </strong>He who gives you the ability to produce wealth, and so confirms His covenant…","<strong>Let’s talk about the ability to produce wealth. </strong>","One thing that humbles my heart about this topic of wealth creation is the fact that some strive and do all it takes to get wealth legally with their own knowledge and strength. They apply all the principles of Wealth creation that the world acknowledges and they get it. And some don’t, even though they put in the work.","Another set go through the illegal route: they cheat others in order to amass wealth, and they get it but never enjoy it.","Then there is the set God spoke to: those who are yielded to Him and have learnt His ways. He said, “This is Wisdom: Follow my commands and listen to my instructions. <strong>I DERIVE PLEASURE IN GIVING WEALTH TO THOSE WHO DEPEND ON ME FOR THE ABILITY TO PRODUCE WEALTH.”</strong>","Which category do you belong to? Which category would you rather belong to? I’d rather you be in the third category, even if it means letting go of independence. I will be wealthy, and I won’t have to strive for it. The power to produce wealth, the strength to take the right actions will be given. I won’t have to figure it out alone. I’d rather be in this category. It is like your boss sending you on an errand and still providing a vehicle that will take you there.","Would you love to strive and be spent to become wealthy even at the expense of losing your soul, or would you love to be strengthened and enabled to produce wealth even if it means letting go of self-dependence?","<strong>We know the principles of Wealth creation and we apply them. But we don’t limit Him to principles that can work for anybody</strong> (whether yielded or not), because they are fixed laws of nature.","We have an advantage. We don’t strive. He gives us the power to produce wealth; He leads us to the right investments, He gives us the right ideas to execute, He opens our eyes to the right problems to solve and even creates demands for our sake.","<strong>The topic “Wisdom to Get Wealth” is not for lazy people.</strong> If you think I’m saying the third category of people don’t work and everything just comes to them, you need to read it again.","Let’s read this together. Read it aloud if possible. <strong>“LAZY HANDS MAKE A MAN POOR, BUT DILIGENT HANDS BRING WEALTH”, <em>Prov. 10:4</em></strong>.","Let’s continue tomorrow where we will talk about Wisdom and Diligence."],"x":"Recognize your Wealth advantages in God and start leveraging them. He gives the ability to produce wealth and so HE has placed these abilities in us. Ask the Holy Spirit to help you recognize yours if you haven’t yet.","m":2,"p":"I pay attention to what I need in Jesus. I do not glorify suffering or anything God does not glorify. The divine power of Christ has provided me with all that I need for life and godliness. From today onward, my heart is open to the wisdom for producing wealth. It starts to form in my heart, and I start to understand how to use the ideas, giftings and provisions God has given me for wealth creation. I receive the grace to channel my resources to the right quarters, where God is glorified and His kingdom is established. I understand balance, and I will not fall victim to extremes, in Jesus’ name. My feeble hands are made strong, in Jesus’ name."},{"d":22,"t":"Wisdom and Diligence","b":["<strong>Prov. 10:4 - Lazy hands make a man poor but diligent hands bring wealth.</strong>","I was saying yesterday that the discussion about “Wisdom to Get Wealth” isn’t for lazy people. <strong>Remember, being Lazy is different from Waiting on God or not taking a step yet because He hasn’t commanded you to.</strong>","Being Lazy and Trusting God are two different things. But many times, lazy people camouflage their laziness as trusting God. One of the ways to know if you are lazy is when God has committed a project into your hands, given you an idea with a sense of urgency, but you chose to be lackadaisical about it. You treated it with contempt and did nothing about it. Or sometimes you even execute, but in a manner as good as not executing. You procrastinated on it till the urgency of the idea became watered down in your heart. Then you still went on asking God for new ideas, saying, “Why am I not becoming wealthy?”","What He gives you is the <strong>ABILITY TO PRODUCE WEALTH, </strong>He doesn’t take the complete ownership or responsibility from you. There are certain actions that you are the one who must take.","There are many other ways you exhibit laziness. As you read this, one of the things you should trust the Holy Spirit to help you do is figure them out and work on them. (Don’t procrastinate on that.)","<strong>The Subject of Wealth Creation is more about OBEDIENCE than OWNERSHIP. It looks like:</strong>","God gives you an idea, instructing you on how to execute and you obey.","God opens your eyes to a problem no one is paying attention to, or one they have seen but didn’t solve well, and you pick it up and fix it.","God leads you to the right investment to make, and then He blesses it.","Does this still look like what a lazy man can do? DILIGENCE AND OBEDIENCE are important in Wealth Creation for the third category where we belong.","Wisdom attracts riches and honour, enduring wealth and prosperity (Prov. 8:18). Desire wisdom, walk in wisdom, apply knowledge and see Wisdom attract wealth to your house. <strong>WEALTH IS ONE OF THE PACKAGES EMBEDDED IN WISDOM. DESIRE WISDOM ABOVE ALL THINGS.</strong> To the discerning, this is Wisdom!"],"x":"DILIGENCE AND OBEDIENCE are inseparable for the category who trusts God for the ability to produce wealth.","m":2,"p":"I come into the grace God has made available for diligence. The Spirit that quickened Jesus quickens my mortal body. I enjoy and experience the Holy Spirit as the Spirit of diligence. I have the wisdom to act on my ideas. All shackles of limitation are broken in my heart, mind and entire life. I enjoy the dividends of diligence and obedience. I do not labour like a fool. My work counts and yields bountiful results, in Jesus’ name."},{"d":23,"t":"Wisdom and the Right Audience","b":["<strong>Proverbs 1:5 NIV - Let the wise listen and add to their learning, and let the discerning get guidance.</strong>","<strong>Proverbs 8:8-9 NIV - All the words of my mouth are just; </strong>none of them is crooked or perverse. <strong>To the discerning all of them are right;</strong> they are faultless to those who have knowledge.","When Wisdom speaks or gives counsel, not everyone receives it the same way. This is why, as powerful and wise as the message of the cross is, it is foolishness to those who are perishing. It is foolishness to those who want to make logic out of it. Let’s take the Jews for example: Up till today, traditional and mainstream Jews do not believe in the sonship of Christ or that He was resurrected. Yet this same message, which some of us heard and believed, happened to be the start of the greatest transformation our lives have experienced. I’m a living example.","<strong>Wisdom has an audience. </strong>As one who has started working in the Unconventional Wisdom of God, you’ll be doing yourself a disservice by thinking everyone will accept or reckon with the message of God’s wisdom in your mouth.","<strong>When Wisdom speaks, this is the kind of audience that gets it:</strong>","<strong>A. The Discerning: </strong>Not everyone can discern God’s wisdom. Everyone might be able to differentiate between a good thing and a bad thing. But how about when you are faced with two things to choose from and both of them are good? The question shifts from “Is this good or bad?” to “Is this good or God?” This is where discernment comes in.","To those who are an audience of wisdom, the words of wisdom are right. They hardly fall into error because, by discernment, they can tell which area of their life the words directly speak to. Hence, the words of wisdom are right to the discerning (Prov. 8: 9)","<strong>B. The Knowledgeable: </strong>The Knowledgeable find no fault in the words of wisdom because they aren’t listening to find fault. They listen with an open heart and that way, it is easy for wisdom to speak to their needs and the exact area of their pains. The Words of Wisdom are soothing to them.","<strong>When you listen to find fault, you’ll always find one. And there’s no way you can be instructed by what you’ve faulted. </strong>"],"x":"Wisdom has an audience. Are you an audience of Wisdom? Also, reckon with the fact that not everyone will accept the words of wisdom in your lips. Find an audience of the discerning and the knowledgeable. Never forget this.","m":2,"p":"For all those You have given me and sent me to, I recognise them and they recognise me, in the name of Jesus. I come into the right company of the discerning and knowledgeable, who make walking in Your wisdom easier for me. By Your working in me, I become the right man for these people, and they receive Your Word in my mouth. I identify those I need to learn from, and I receive Your words in their mouths, in Jesus’ name."},{"d":24,"t":"Wisdom in Judgement, Pt. I","b":["<strong>Ps. 119:66 - Teach me knowledge and good judgement, for I believe in your commands.</strong>","<strong>Prov 31:4 - It is not for kings, O Lemuel, not for kings to drink wine, not for rulers to crave beer, lest they drink and forget about what the law decrees… (NIV)</strong>","Another version of Proverbs 31:4 says <strong>“...Lest…they don’t know right from wrong and the people who depend on them are hurt.” (MSG)</strong>","Do you believe in your Kingship? Do you believe your presence here on earth is God’s royalty being present? Have you seen yourself through the lens of royalty with which God has glorified you? If you are still doubting your kingship, you might struggle with accepting these words you are about to read. But brace yourself and ask the Holy Spirit to open you up to your Kingship dimension.","But you are a chosen people, a <strong>royal</strong> priesthood…(1Pet. 2:9)...And hast made us unto our God <strong>kings</strong> and priests: and <strong>we shall reign on the earth</strong>. (Rev. 5:10) You can go ahead and read those two scriptures on your own today and meditate on them. They will give you a better insight into what this kingship entails.","If you are the other version who already understands your position as a king, follow me. Even if you don’t, still follow me and read till the end.","A wise man doesn’t debate between what is good and what is a sin. He doesn’t say, “It is not a sin, so what’s wrong if I do it? I’m justified in doing it so long as it’s not recorded as a sin.”","<strong>The judgement of a wise man isn’t between “good” and “bad” but between “good” and “God”.</strong>","Now, let’s go back to the text I introduced earlier. That is Proverbs 31:4. For King Lemuel, was it a question of “whether beer is good or not”? NO! It was a matter of the repercussions of beer on the ruler and the kingdom he is to rule over. This same beer was recommended to those in anguish as a means of forgetting their sorrows, but it was rejected for a king. Context!","Wisdom helps you with Context. Wisdom guides you on what to do with context. Wisdom judges by context, not by general rules or general applications of those rules. Wisdom discerns context and applies the right judgement.","Not all good things are good for you, and not all pleasurable things are for you. God’s wisdom is what helps you discern what He is saying specifically to you and the role He will have you play.","It is not good for kings not to understand context (in alignment with God’s Word). It is not good for kings not to apply the right judgement per season. (I added that one myself…<em>smiles</em>) You are a king! You are a royal priesthood"],"x":"The judgement of a wise man isn’t between “good” and “bad” but between “good” and “God”. Wisdom helps you with Context and guides you on what to do with context.","m":2,"p":"Lord, save me from every lure of leadership that might make me a stumbling block to others. Bring me into the consciousness of my identity as a king, and help me to live as one. Strengthen my discernment and help me to discern between what is good and what is You."},{"d":25,"t":"Wisdom in Judgement, Pt. II","b":["<strong>1 Cor. 5:12 - It isn’t my responsibility to judge outsiders, but it certainly is your responsibility to judge those inside the church who are sinning.</strong>","This angle we are about to touch is a completely different one, which we rarely talk about. The Holy Spirit pointed my attention to it while I was trying to write Pt. II, as I was reading something entirely different.","It is you people, o. The “Don’t judge me” and “Don’t judge Him” community. I know you reading this aren’t in their group chat. You pressed the “Exit” button on the first day they added you. Because, tell me, why would they add us to a community without informing us? <em>(Smiles) </em>","The wave of “Don’t judge me” that people propagate in the media space and all around us is dismaying. Let’s look at the meaning of “JUDGE” - To judge, according to the Merriam-Webster dictionary, means “to form an opinion about through careful weighing of evidence and premises.” Another meaning is “The ability to look at a person’s habits, words, and choices to figure out their true moral nature.” If we look at this meaning carefully, you will see that you have judged in one way or another, whether you agree now or not. You have held an opinion about someone which you discovered wasn’t true after careful evaluation or after being with them over time.","People even use this passage where Jesus said “Judge not, that ye be not judged” (Matthew 7:1) to back up their claims. If you read that passage well, Jesus called out hypocrites: those who know how to criticize, correct and condemn others with unfair attitudes or out of jealousy. They aren’t doing it because they want you to get better or change, but because they want to bring you down.","Bible Ref, a Bible explanatory site, wrote, and I quote, “Jesus’ other teachings explicitly indicate that right judgment is necessary (John 7:24), while hypocritical or shallow judgment is wrong.”","<strong>Right judgement is necessary, hypocritical judgement is wrong.</strong> Paul showed us an example of what right judgement might look like based on the context of what was happening at that time. He said in <em>1 Cor. 5:12-13,</em> <em>“It isn’t my responsibility to judge outsiders, but it certainly is your responsibility to judge those inside the church who are sinning…God will judge those on the outside.”</em>","<strong>If what you mean by “Don’t judge me” is “Don’t hold me accountable for the wrong I did”</strong>, “Nobody should say anything, they should all overlook it”, “I don’t owe anyone an explanation”, “I don’t accept feedback,” then what you are fighting against isn’t judgment; <strong>you hate accountability</strong>.","In the community of faith, the community of wisdom, we hold ourselves accountable. We understand that we can’t really go far without accountability.<em> (Read that again)</em>","<strong>Proverbs 9: 8-9 says</strong> “Do not rebuke a mocker or he will hate you; <em>rebuke a wise man and he will love you. Instruct a wise man and he will be wiser still…”</em>","Where do you belong? Are you a Mocker or a wise man?"],"x":"Right judgement is necessary, hypocritical judgement is wrong. Rebuke a wise man and he will love you. Instruct a wise man and he will be wiser still. Don’t disguise lack of accountability as “People judging you”. Examine it instead.","m":3,"p":"Lord, give me a heart that can receive constructive feedback. Don’t let me be a rebel. In any way I am subtly becoming rebellious, Lord, save me before it takes hold of me. Help me to have the right opinion of people and to see them through the lens with which You see them."},{"d":26,"t":"Wisdom for the Simple, Foolish and Mockers, Pt. I","b":["<strong>Proverbs 1:22 <em>NIV </em>- How long will you who are simple love your simple ways? How long will mockers delight in mockery and fools hate knowledge?</strong>","<strong>Proverbs 1:22 <em>AMP </em>- “How long, O </strong>naive ones [you who are easily misled]<strong>, will you love being simple-minded and undiscerning? How long will </strong>scoffers [who ridicule and deride] <strong>delight in scoffing, how long will </strong>fools [who obstinately mock truth] hate knowledge?”","You might have wondered who the Simple, Foolish and Mockers are. Let’s check it out. The Amplified version of the Bible already gave us an insight into who these people are and if you find any of these traits in you, it is not the time to harden your heart but to genuinely ponder it and trust the Holy Spirit to help you adjust where necessary.","<strong>The Simple: </strong>They are naive and easily misled. They go with the flow and are okay with whatever becomes popular or whatever the world calls wisdom. They are easily influenced by evil. Their mantra is “Soft Life only”. They aren’t inquisitive in any way, and they are most times ignorant and undiscerning. They reject anything that is contrary to what feels safe to them or can stretch them, even if it is God’s wisdom. They love their simple ways and are attached to them. Don’t even try to help them out of their simpleness because they are the type who say “That is who I am” or “That’s how I’ve always known how to do my thing”.","<strong>Simple-mindedness will make you think Unconventional Wisdom is only for a certain kind of people and not for you.</strong> After all, “Life isn’t that deep”, that’s what you always say until you become prey to the wiles, schemes and devices of the enemy and the mind control mechanism of the ruler of the kingdom of the air - The spirit who is now at work in those who are disobedient (Ephesians 2:2)","One would have thought God would commend them for being simple. Probably He will say “Thank you for being neutral (you don’t hate evil, neither do you love God)” or “Thank you for playing it safe” or “Thank you for being contented and satisfied with the common”. But no, their simple ways have made it hard for them to receive wisdom and their simplicity will only lead them to destruction (Prov. 1:32)"],"x":"Simple-mindedness hinders you from coming into the Unconventional Wisdom of God. If you turn away from simple-mindedness, He will pour out His heart to you and make His thoughts known to you.","m":2,"p":"I come up higher, in Jesus’ name! I think new thoughts and come into a better knowledge of Christ. I am healed of the simple-mindedness that hinders me from coming into the fullness of God. A new hunger for the knowledge and wisdom that come from God is stirred up within me, in Jesus’ name."},{"d":27,"t":"Wisdom for the Simple, Foolish and Mockers, Pt. II","b":["<strong>Proverbs 1:22 NIV - </strong>How long will you who are <strong>simple</strong> love your simple ways? How long will <strong>mockers</strong> delight in mockery and <strong>fools</strong> hate knowledge?","Let’s continue to dig into who the Foolish and the Mockers are.","<strong>The Foolish: </strong>Plot twist: the Foolish aren’t those who are drooling (saliva coming out of their mouth) or wearing tattered clothes on the street. They are smart people by human standards. They have the knowledge of technology, finance, business, etc., but they have determined to live only by their own knowledge, independent of God. They hate the knowledge of God and they mock the truth. They see no need for godly counsel and have harboured pride. They are close-minded and self-confident.","As smart as they are, they are foolish in God’s sight. Because they are proud, you can tell what their end is. The self-dependency started with pride and gravitates toward what can ruin them (destruction). <em>Prov 16:18</em>","Foolishness will make you think you are smart and knowledgeable, hence no need for God.","What the Foolish need is understanding. It’s not as if they don’t know the way of wisdom, but they choose to live independent of it. Are you not also smart by the standards of the world but foolish in the sight of God? To you who are foolish, gain understanding<em>. </em>Seek the insight and self-discipline that leads to godly <strong>wisdom</strong><em> (Prov. 8:5) Emphasis mine.</em>","<strong>The Mocker: </strong>They are rebels. They are proud and they make it obvious they hate God. They ridicule those who choose to walk in God’s wisdom. They mock those who trust in God’s wisdom. They are wise in their own eyes, but God says their end therefore is mockery (Prov.1: 26)","If you have ever found yourself in the midst of this category of people (The Mockers), don’t panic. The word of God already spoke about them - their end is destruction. And there’s wisdom on how to handle them…Blessed is the man that stands not in the way of sinners <strong>nor sits in the seat of the scornful…(Ps. 1:1)</strong>","Don’t sit in their seats; don’t indulge them, or else they’ll change your understanding of God and make you question your convictions about Him, even the experiential knowledge you have of Him. They will make you think that, after all, it’s not that deep: just do good, be excellent at your work, love yourself and love everyone around you. As if human nature even has the capacity to love truly except by the help of God through the Holy Spirit.","And if you are one, I pray for you that you’ll come into the true revelation of God. He will put a hunger in your heart to seek and as you seek answers, you’ll find Him. If you truly come into the revelation of who God is; your perspective and understanding of life will change. GOD IS TOO REAL for us to pretend! GOD IS TOO REAL for us to live as if we own ourselves or as if we have control over the breath of our nostrils.","The pride you have in your knowledge and self-acclaimed wisdom can’t even earn you control over the breath of your nostrils and every other thing you want to do on earth. Your claim that you don’t need God is only as relevant as the availability of breath in your nostrils. Take it away, and all the pride ends there. So, who lied to you that the one who has control over your existence and even the breath of your nostrils is not real?"],"x":"Delight in God’s word and seek to know His perspective about every topic before accepting it to be true. And when you know His perspective, obey, make it your standard. This is Wisdom!","m":3,"p":"In a generation with many mockers and perverse men, Lord, help me to be wise. Help me to jealously guard my understanding and revelation of You. Do not let me be dismayed."},{"d":28,"t":"Holy Spirit: The Spirit of Wisdom","b":["<strong>John 16:13-14 NLT - [13] When the Spirit of truth comes, he will guide you into all truth. He will not speak on his own but will tell you what he has heard. He will tell you about the future. [14] He will bring me glory by telling you whatever he receives from me. </strong>","<strong>John 14:26 NIV - But the Advocate, the Holy Spirit, whom the Father will send in my name, will teach you all things and will remind you of everything I have said to you. </strong>","Before you read this, ensure you read the Bible passage above. Go ahead and read it twice. Oh my God! We can’t talk about the subject “Unconventional Wisdom” and sideline this topic we’ll be discussing today. We can’t sideline the Holy Spirit from the subject of Wisdom. Never! Do you know why? Let me tell you one of the reasons.","When I defined Wisdom in the earlier part of this devotional, one of the definitions explained what Wisdom is - Wisdom is the ability to apply the knowledge of the word of God and the knowledge of the person of God towards a course of action and make sound decisions. Life is progressive and we get to meet ourselves in different seasons of life that require different approaches or methods from what we used to know. God Himself is diverse in His ways and His ways aren’t the ways of men. He can lead you towards a different path or instruct you to use a different approach from what you’ve been used to. Wisdom then is being placed face-to-face with two right things and still being able to choose not just what is right at that moment but what is God’s. How can you then discern this without the Holy Spirit?","Wisdom is one of the expressions of the Holy Spirit…See how John described this - <em>But the Advocate,</em> the Holy Spirit, <em>whom the Father will send in my name,</em> will teach you all things <em>and will</em> remind you of everything I have said (John 14:26).","I wrote this part of the devotional you’re reading around 12:31am. That night, I was on a call with my friend and what started as just a random check-in became an experience of the Holy Spirit, and that was how He spurred me to write this particular part of the devotional. He had given me the topic months ahead, but the contents weren’t forming in my heart. But that night, I knew what to write and I was enabled to write it.","Our conversations switched from “Let me just say what’s on my heart to my friend” to “How come you know what’s in my journal and what the Holy Spirit has been discussing with me?” We experienced the wisdom of the Holy Spirit and got the same understanding of a matter we hadn’t discussed with each other before that time.","I can go on and on sharing my experiences of how I have enjoyed the wisdom expression of the Holy Spirit. I remember the time I wanted to name my business: He gave me prototypes to study and helped me draw out a name from them that doesn’t look like a copy of those prototypes. The name has a relevance that goes beyond that moment, and it’s still relevant up till now. There’s no business I want to build or new venture that doesn’t fit into the name. It’s an umbrella name. The Holy Spirit goes beyond conversations, business, etc. He is deeper and can be expressed in more ways than that. After all, He taught the apostles languages they didn’t know before (Acts 2:4-12). But I’m just giving you a glimpse into how practical the Wisdom from the Holy Spirit can be. Don’t box Him to one expression.","The Holy Spirit can teach you all things and remind you of everything Jesus has said and has taught (I am paraphrasing). The Holy Spirit is the one who can teach you what Wisdom means to God. The decisions of Wisdom are practical and they aren’t something you make once in a while. The decisions you make daily either contribute to Wisdom or Folly. The Holy Spirit is that enabling spirit who can teach you what Wisdom means daily and enable you to choose wisdom daily.","You cannot truly yield to or engage the Holy Spirit and the Word of God and not become wise. He teaches, He counsels, He guides and even leads you to your teachers (in human form). The Holy Spirit isn’t insecure. He can show you those whom He has taught and is teaching, and He can also be a voice of guidance to you (in human form). That’s still His wisdom.","This is my desire for you:","….<em>That the God of our Lord Jesus Christ, the glorious Father, may give you the Spirit of wisdom and revelation, so that you may know him better.</em> - Ephesians 1:17 NIV."],"x":"The Holy Spirit is the enablement God has given you to be able to walk in His wisdom and will. Quit trying to please God by your own strength. Ask for the enablement of the Holy Spirit. Engage the Holy Spirit in your journey to becoming wiser by God’s standards. (Acts 1:8)","m":4,"p":"Dear Holy Spirit, be more real to me. I give You full permission in all areas of my life. Guide me, lead me and bring me into the knowledge of all truth. I want to experience You as the Spirit of wisdom."},{"d":29,"t":"Receiving Wisdom Without Doubt","b":["<strong>James 1:5 - If any of you lacks wisdom, you should ask God, who gives generously to all without finding fault, and it will be given to you. </strong>","God is willing to give Wisdom to all men. He gives freely and He is not biased. But do you know that not everyone will receive wisdom? Not because God isn’t willing to give, but for a reason I’m going to show you now.","James 1:6-8 (NIV) puts it this way:","[6] But <em>when you ask, you must believe and not doubt</em>, because <em>the one who doubts is like a wave of the sea, blown and tossed by the wind.</em> [7] <em>That person should not expect to receive anything from the Lord.</em> [8] Such a person is double-minded and unstable in all they do.","Because of their double-mindedness and instability… Yes! A Double-minded person shouldn’t expect to receive anything from the Lord. Our entire journey with God is encompassed in faith. Faith is key to receiving from God.","Ask and believe you’ve received without doubt. Don’t wait on His Wisdom concerning a thing and still try to use your own wisdom to sort it out. Not all men have come to that level of total dependence where they don’t see themselves as “wise” in their own eyes and see a need to ask for His wisdom.","There’s a kind of heart posture that receives from God - A heart without doubt, a heart with a strong conviction that if God says I should ask, then He means it. He will definitely give. God won’t give His wisdom to a man who doesn’t have the right heart posture to steward it.","<strong>Salvation is free to all men, but you have to believe in your heart and confess with your mouth the Lordship of Jesus. Likewise with wisdom: you have to love Wisdom and desire it.</strong>","Wisdom comes to those who love her (Prov. 8:17); Wisdom comes to those who acknowledge they lack it and then proceed to ask God (James 1:5). This Unconventional Wisdom we are talking about, which is Godly Wisdom, does not come to those who already think they know. If you desire Godly Wisdom that is unconventional, different from the world’s standards but aligned with God’s standard and defying the norms, then you will have to ask with your own mouth. Wisdom cannot be imparted to you by anyone except the Lord.","Wisdom comes with a lot of family members (like wealth, riches, honour, etc.). That’s why you have to be a yielded man at heart and in obedience to the Lord to be able to steward Wisdom appropriately without destroying yourself."],"x":"Ask for Wisdom with no doubt in your heart. Love Wisdom, desire Wisdom and seek the Wisdom that is from God. Do not doubt that He can give you. For anyone who doubts is like a wave tossed to and fro and can fall for anything that disguises itself as Wisdom. Such a person cannot receive God’s wisdom.","m":2,"p":"Lord, I genuinely ask for Wisdom. I know a man cannot receive anything unless it has been given to him by God, and I also know You said that if anyone asks, he will receive. Breathe on me, Wisdom. Let wisdom become the anchor of my life. Help me to start to walk in the wisdom that comes from You."},{"d":30,"t":"Wisdom Calls for Separation","b":["<strong>Titus 2:11-13 (NIV) - For the grace of God has appeared that offers salvation to all people. It teaches us to say “No” to ungodliness and worldly passions, and to live self-controlled, upright and godly lives in this present age, while we wait for the blessed hope—the appearing of the glory of our great God and Savior, Jesus Christ, </strong>","<strong>The Life of True Wisdom is a Life of Separation. </strong>Not separation from people but separation from worldly cultures: a life that defies the norms (patterns of thinking, culture, systems and character normalized by the world that don’t have their root in God and His Word).","To choose to live in the Unconventional Wisdom of God is to choose to be set apart, to stand out for Him, even if standing out means saying no to many offers that would make you no different from the world and the desires of its heart. <em>If we have the same hunger, passion and desires as the world, how then are we different from them?</em>","Wisdom will make you say <em>“NO” </em>to many things that do not align with your source (God). And <em>“NO”</em> isn’t just a mouth declaration but a heart conviction. You can be saying “NO” with your mouth but your heart is still with the world and its desires. Saying “NO” should stem first from a conviction in your heart to be separate for God, then back it up with actions, through the help of the Holy Spirit.","Never forget this: The Holy Spirit can enable you to be separate.","Wisdom will want to create with you what everyone isn’t paying attention to yet. He wants to show the possibilities that exist with God, through you. But if you are just obsessed with doing what is popular, trending or is working already for someone else, you can miss out on this dimension of wisdom.","Wisdom calls and He says:","Therefore, “Come out from them and be separate…” (2 Corinthians 6:17)","Wisdom affects your association.","He who walks with the wise will be wise, but the companion of fools will be destroyed.","If you want to grow in wisdom, spend time with the wise. Walk with the wicked and you will eventually become just like them. <em>(Prov 13:20 TPT).</em>","This is an invitation to join a community of Kingdom-minded Leaders and builders trained in the order of God’s wisdom. If you’d love to go through a deeper dive into the contents of this devotional alongside others, then this might be the right association you’ve been praying for.","<strong>Scan the QR code to learn more about the community.</strong>"],"x":"","m":2,"p":"Lord, I separate myself unto You. I separate myself from my old ways, patterns of thinking and attitudes. I come into the newness that Your wisdom is birthing in me. I yield myself to Your wisdom. Through wisdom, I live, love, build, lead, think and grow."}];
</script>
<script>
/* Devotional: day list + reader. Each day opens at 5am after the previous one is marked read. */
(function () {
  'use strict';
  var UW = window.UW, Store = UW.Store, Board = UW.Board, P = UW.POINTS, esc = UW.esc, icon = UW.icon;
  var DAYS = window.UW_DAYS || [], TOTAL = UW.CONFIG.totalDays;

  var listView = document.getElementById('list-view');
  var readerView = document.getElementById('reader-view');
  var bar = document.getElementById('read-progress');
  var filter = 'all', current = 0, kind = '';
  var SCRIPTURE = /^<strong>\s*(?:[1-3]\s?)?[A-Za-z]+\.?\s*\d+\s*:\s*\d+/;

  function plain(h) { return String(h).replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim(); }
  function cd(n) { return '<b data-unlock-day="' + n + '">' + UW.fmt(Store.msUntil(n)) + '</b>'; }

  /* ---------- list ---------- */
  function renderList() {
    var curN = Store.currentDay(), allDone = Store.allRead();
    var html = DAYS.filter(function (d) {
      var read = Store.state(d.d) === 'read';
      return filter === 'all' || (filter === 'done' ? read : !read);
    }).map(function (d) {
      var st = Store.state(d.d), isCur = d.d === curN && !allDone && st === 'open';
      var status = st === 'read' ? '<span class="pill good">' + icon('check') + 'Read</span>'
        : st === 'waiting' ? '<span class="pill">' + icon('clock') + 'Waiting</span>'
        : st === 'locked' ? icon('lock') : (isCur ? '<span class="pill">Up next</span>' : '');
      var meta = st === 'waiting' ? 'Opens in ' + cd(d.d) : st === 'locked' ? 'Finish Day ' + (d.d - 1) + ' first' : d.m + ' min read';
      var inner = '<span class="top"><span>Day ' + d.d + '</span>' + status + '</span><h3>' + esc(d.t) + '</h3><span class="meta">' + meta + '</span>';
      var cls = 'day-card' + (isCur ? ' current' : '') + (st === 'waiting' || st === 'locked' ? ' locked' : '');
      if (st === 'waiting' || st === 'locked') return '<li><div class="' + cls + '">' + inner + '</div></li>';
      return '<li><a class="' + cls + '" href="#day-' + d.d + '">' + inner + '</a></li>';
    }).join('');
    document.getElementById('day-grid').innerHTML = html || '<li class="muted">Nothing here yet.</li>';
  }

  document.querySelectorAll('[data-filter]').forEach(function (b) {
    b.addEventListener('click', function () {
      filter = b.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      renderList();
    });
  });

  /* ---------- reader ---------- */
  function bodyHtml(day) {
    return day.b.map(function (p) { return SCRIPTURE.test(p) ? '<blockquote>' + p + '</blockquote>' : '<p>' + p + '</p>'; }).join('');
  }

  function setJsonLd(day) {
    document.getElementById('ld-day').textContent = JSON.stringify({
      '@context': 'https://schema.org', '@type': 'Article', headline: 'Day ' + day.d + ': ' + day.t, position: day.d,
      inLanguage: 'en', timeRequired: 'PT' + day.m + 'M',
      isPartOf: { '@type': 'Book', name: 'Unconventional Wisdom: 30-Day Devotional for Leaders and Builders to Learn Godly Wisdom' },
      description: (day.x || plain(day.b[0] || '')).slice(0, 200)
    });
  }

  function renderFinish() {
    var el = document.getElementById('finish'); if (!el) return;
    var n = current, st = Store.state(n), pr = Store.progress(n), html;
    if (st === 'read') {
      html = '<button class="btn btn-gold complete-btn" type="button" disabled aria-disabled="true">' + icon('check') + 'Day ' + n + ' read</button>';
      if (pr.check) html += '<p class="muted small complete-note">' + (n < TOTAL ? 'Check-in done. Day ' + (n + 1) + ' opens at 5am.' : 'You have finished all ' + TOTAL + ' days.') + '</p>';
      else html += '<a class="btn" href="journals.html#day-' + n + '">' + icon('note') + 'Open your journal and check-in</a><p class="muted small complete-note">' + (n < TOTAL ? 'Day ' + (n + 1) + ' opens once you tick all three boxes.' : 'Tick all three boxes to finish the devotional.') + '</p>';
    } else if (!Store.user()) {
      html = '<button class="btn complete-btn" type="button" id="complete-btn">' + icon('lock') + 'Sign in to complete Day ' + n + '</button>' +
        '<p class="muted small complete-note">Create a free account or sign in to save your days and keep your streak.</p>';
    } else {
      html = '<button class="btn complete-btn" type="button" id="complete-btn">' + icon('check') + 'Mark Day ' + n + ' as read</button>';
    }
    el.innerHTML = html;
  }

  function updateNext() {
    var nx = document.getElementById('next-link'); if (!nx) return;
    var n = current + 1;
    if (Store.isUnlocked(n)) { nx.setAttribute('href', '#day-' + n); nx.removeAttribute('aria-disabled'); nx.classList.remove('is-disabled'); }
    else { nx.removeAttribute('href'); nx.setAttribute('aria-disabled', 'true'); nx.classList.add('is-disabled'); }
  }

  function renderReader(n) {
    var day = DAYS[n - 1]; current = n;
    if (!day) { location.hash = ''; return; }
    var st = Store.state(n);
    kind = (st === 'waiting' || st === 'locked') ? st : 'open';
    document.title = 'Day ' + n + ': ' + day.t + ' | Unconventional Wisdom';
    var md = document.querySelector('meta[name="description"]');

    if (kind !== 'open') {
      if (md) md.setAttribute('content', 'Day ' + n + ' of the Unconventional Wisdom 30-day devotional.');
      document.getElementById('ld-day').textContent = '';
      readerView.innerHTML = '<div class="reader locked-box"><div class="lock-badge">' + icon(kind === 'waiting' ? 'clock' : 'lock') + '</div>' +
        '<p class="muted" style="margin:0">Day ' + n + ' \u00b7 ' + esc(day.t) + '</p>' +
        (kind === 'waiting'
          ? '<h1 tabindex="-1" id="reader-h1">Opens in <span class="big-count" data-unlock-day="' + n + '">' + UW.fmt(Store.msUntil(n)) + '</span></h1><p class="muted" style="max-width:34ch;margin-inline:auto">Each new day opens at 5am.</p>'
          : '<h1 tabindex="-1" id="reader-h1">Day ' + n + ' is locked</h1><p class="muted" style="max-width:34ch;margin-inline:auto">Finish Day ' + (n - 1) + ' and tick its check-in to unlock this day.</p>') +
        '<a class="btn" href="#day-' + (kind === 'waiting' ? n - 1 : Store.currentDay()) + '">' + (kind === 'waiting' ? 'Review Day ' + (n - 1) : 'Go to your current day') + '</a></div>';
      return;
    }

    if (md) md.setAttribute('content', (day.x || plain(day.b[0] || '')).slice(0, 155));
    setJsonLd(day);
    var fs = parseFloat(localStorage.getItem('uw:fs')) || 1;
    var prev = n > 1 ? '<a class="btn btn-ghost" href="#day-' + (n - 1) + '">' + icon('left') + 'Day ' + (n - 1) + '</a>' : '<span></span>';
    var next = n < TOTAL ? '<a class="btn" id="next-link" href="#day-' + (n + 1) + '">Day ' + (n + 1) + icon('right') + '</a>' : '<a class="btn" href="journals.html">Journals</a>';
    var prayer = day.p ? '<section class="prayer" aria-label="Prayer"><h2>Prayer</h2><p>' + esc(day.p) + '</p></section>' : '';
    var dose = day.x ? '<section class="dose" aria-label="Key dose"><h2>Dose ' + n + '</h2><p>' + esc(day.x) + '</p></section>' : '';

    readerView.innerHTML =
      '<article class="reader" id="reader-article">' +
      '<div class="reader-top"><a class="btn btn-ghost btn-sm" href="#">' + icon('left') + 'All days</a>' +
      '<div style="display:flex;gap:.25rem;align-items:center"><button class="icon-btn" type="button" data-fs="-1" aria-label="Smaller text" style="font-weight:700;font-size:.85rem">A\u2212</button>' +
      '<button class="icon-btn" type="button" data-fs="1" aria-label="Larger text" style="font-weight:700;font-size:1.1rem">A+</button>' +
      '<button class="icon-btn" type="button" id="share-btn" aria-label="Share this reading">' + icon('share') + '</button></div></div>' +
      '<p class="muted" style="margin-bottom:.3rem">Day ' + n + ' of ' + TOTAL + '</p>' +
      '<h1 id="reader-h1" tabindex="-1">' + esc(day.t) + '</h1>' +
      '<div class="meta-line"><span class="pill">' + day.m + ' min read</span></div>' +
      '<div class="prose" id="prose" style="--fs:' + fs + '">' + bodyHtml(day) + '</div>' + dose + prayer +
      '<div class="complete-wrap" id="finish" aria-live="polite"></div>' +
      '<nav class="day-nav" aria-label="Day navigation">' + prev + next + '</nav></article>';
    renderFinish(); updateNext();
  }

  readerView.addEventListener('click', function (e) {
    if (e.target.closest('#complete-btn')) {
      if (!Store.user()) { location.href = 'you.html?next=' + encodeURIComponent('devotional.html#day-' + current); return; }
      var res = Store.award(current);
      if (res) UW.toast('Day ' + current + ' read. Now write in your journal and tick your check-in' + (current < TOTAL ? ' to unlock Day ' + (current + 1) + '.' : '.'));
      return;
    }
    var fsb = e.target.closest('[data-fs]');
    if (fsb) {
      var steps = [0.9, 1, 1.15, 1.3], cur = parseFloat(localStorage.getItem('uw:fs')) || 1;
      var i = Math.min(steps.length - 1, Math.max(0, Math.max(0, steps.indexOf(cur)) + parseInt(fsb.dataset.fs, 10)));
      localStorage.setItem('uw:fs', steps[i]);
      document.getElementById('prose').style.setProperty('--fs', steps[i]);
      return;
    }
    if (e.target.closest('#share-btn')) {
      if (navigator.share) navigator.share({ title: document.title, url: location.href }).catch(function () {});
      else if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function () { UW.toast('Link copied'); });
      return;
    }
    var nx = e.target.closest('#next-link');
    if (nx && nx.getAttribute('aria-disabled') === 'true') {
      e.preventDefault();
      UW.toast(Store.progress(current).check ? 'Day ' + (current + 1) + ' opens in ' + UW.fmt(Store.msUntil(current + 1)) : Store.state(current) === 'read' ? 'Tick your Day ' + current + ' check-in in your journal to unlock the next day' : 'Mark Day ' + current + ' as read, then tick your check-in');
    }
  });

  window.addEventListener('scroll', function () {
    var art = document.getElementById('reader-article');
    if (readerView.hidden || !art) { bar.hidden = true; return; }
    bar.hidden = false;
    var r = art.getBoundingClientRect(), total = r.height - window.innerHeight;
    bar.style.width = (total > 0 ? Math.min(100, Math.max(0, (-r.top / total) * 100)) : 100) + '%';
  }, { passive: true });

  /* ---------- routing ---------- */
  function route() {
    var m = /^#day-(\d+)$/.exec(location.hash);
    if (m) {
      listView.hidden = true; readerView.hidden = false;
      renderReader(parseInt(m[1], 10));
      window.scrollTo(0, 0);
      var h1 = document.getElementById('reader-h1'); if (h1) h1.focus({ preventScroll: true });
    } else {
      readerView.hidden = true; listView.hidden = false; bar.hidden = true;
      document.title = '30-Day Devotional Readings | Unconventional Wisdom';
      document.getElementById('ld-day').textContent = '';
      renderList();
    }
  }
  window.addEventListener('hashchange', route);

  document.addEventListener('uw:change', function () {
    if (!listView.hidden) { renderList(); return; }
    var st = Store.state(current), k = (st === 'waiting' || st === 'locked') ? st : 'open';
    if (k !== kind) { var y = window.scrollY; renderReader(current); window.scrollTo(0, y); }
    else if (kind === 'open') { renderFinish(); updateNext(); }
  });
  route();
})();

</script>
</body>
</html>
